name: ARR P1 Blueprint Transformer

on:
  push:
    branches:
      - reconcile/arr-p1-a3-transform

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/arr-p1-a3-transform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Apply reviewed constitutional reconciliation
        run: node scripts/arr-p1-blueprint-transform.mjs
      - name: Regenerate projections
        run: npm run docs:generate
      - name: Verify transformed tree
        run: npm run verify
      - name: Remove transport-only transformer
        run: rm .github/workflows/arr-p1-blueprint-transform.yml scripts/arr-p1-blueprint-transform.mjs
      - name: Commit only transformed repository tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'docs: reconcile product blueprint with D-011 through D-016'
          git push origin HEAD:reconcile/arr-p1-a3-transform
