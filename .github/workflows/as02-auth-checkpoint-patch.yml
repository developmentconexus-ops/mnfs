name: AS-02 Auth Checkpoint Patch

on:
  push:
    branches:
      - spike/as-02-local-sandbox
    paths:
      - .github/workflows/as02-auth-checkpoint-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/as-02-local-sandbox
          fetch-depth: 0
      - name: Bind pinned auth adapter to restart identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('spikes/as-02/src/orchestrator-runtime.mjs')
          text = runtime.read_text()
          old_import = "import { brokeredCandidateArgs } from './pi-inventory.mjs';"
          new_import = "import {\n  brokeredCandidateArgs,\n  PI_ANTHROPIC_AUTH_VERSION,\n} from './pi-inventory.mjs';"
          if text.count(old_import) != 1:
              raise SystemExit('unexpected pi-inventory import shape')
          text = text.replace(old_import, new_import)
          old_value = "    pi: tools.pi?.version,\n    treehouse: tools.treehouse?.version,"
          new_value = "    pi: tools.pi?.version,\n    piAnthropicAuth: PI_ANTHROPIC_AUTH_VERSION,\n    treehouse: tools.treehouse?.version,"
          if text.count(old_value) != 1:
              raise SystemExit('unexpected dependency snapshot shape')
          runtime.write_text(text.replace(old_value, new_value))

          restart = Path('spikes/as-02/src/restart.mjs')
          text = restart.read_text()
          old_dependency = "  'pi',\n  'treehouse',"
          new_dependency = "  'pi',\n  'piAnthropicAuth',\n  'treehouse',"
          if text.count(old_dependency) != 1:
              raise SystemExit('unexpected restart dependency shape')
          restart.write_text(text.replace(old_dependency, new_dependency))

          workflow = Path('.github/workflows/as02-auth-checkpoint-patch.yml')
          workflow.unlink()
          PY
      - name: Commit exact patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add spikes/as-02/src/orchestrator-runtime.mjs spikes/as-02/src/restart.mjs .github/workflows/as02-auth-checkpoint-patch.yml
          git commit -m "fix(as02): bind Pi OAuth adapter to restart proof"
          git push origin HEAD:spike/as-02-local-sandbox
