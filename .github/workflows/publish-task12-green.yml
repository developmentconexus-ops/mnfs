name: Publish Task 12 GREEN

on:
  push:
    branches:
      - automation/task12-green-publish
    paths:
      - .github/workflows/publish-task12-green.yml

permissions:
  contents: write

concurrency:
  group: publish-task12-green
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout authorized target branch
        uses: actions/checkout@v4
        with:
          ref: design/mis-002-m01
          fetch-depth: 0

      - name: Checkout reviewed GREEN payload
        uses: actions/checkout@v4
        with:
          ref: automation/task12-green-publish
          path: .task12-publisher
          fetch-depth: 1

      - name: Set up accepted Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Verify authorized target head
        shell: bash
        run: |
          set -euo pipefail
          expected='eb49a1eaa251f4bc5b1cb0dedc49f6de2cbc0dc0'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Reconstruct and verify reviewed GREEN patch
        shell: bash
        run: |
          set -euo pipefail
          payload_dir='.task12-publisher/.github/task12-green-v2'
          test "$(find "$payload_dir" -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 6
          echo '255a0dbe9f009569f6869a3ec84ecc9adb6fac10c6ae8cfb9c3f881e2ee61cf9  .task12-publisher/.github/task12-green-v2/part-00' | sha256sum -c -
          echo 'd41781f6de70af1847dd7f09264dae44e59d85029b53b455554f8c867db571cf  .task12-publisher/.github/task12-green-v2/part-01' | sha256sum -c -
          echo '6294e02cfa1dad7850729bd7559dcaac04720f80564ca5cc384db3772430a8db  .task12-publisher/.github/task12-green-v2/part-02' | sha256sum -c -
          echo 'c5b392596cffc33798a0f5ffde8f80f1a974c45f4e4ec965721569a4b20876f0  .task12-publisher/.github/task12-green-v2/part-03' | sha256sum -c -
          echo 'fdb8181bf9d81b034a4c89dfe29de17c9207a1aa2e9dff68b12d3f991f90265c  .task12-publisher/.github/task12-green-v2/part-04' | sha256sum -c -
          echo 'b9cbc6adde9c600f719e6eefc7ef758cd2a630507cdbdd34624fc2a4c4f4f12d  .task12-publisher/.github/task12-green-v2/part-05' | sha256sum -c -
          cat "$payload_dir"/part-* > /tmp/task12-green.patch.gz.b64
          echo '0b814f27381bce9a75259d580d8dab2e03f7f8b6ab06830ef488bab063d76a1a  /tmp/task12-green.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/task12-green.patch.gz.b64 > /tmp/task12-green.patch.gz
          echo '572b3351ebbd33ed569bf411fe3b1847558a326936c2e9b109f417cae53c5a69  /tmp/task12-green.patch.gz' | sha256sum -c -
          gzip --decompress --stdout /tmp/task12-green.patch.gz > /tmp/task12-green.patch
          echo '396f7d1f356fdf442f7de5eaffb95f4f343db895e71720ba5b1d5eba75966e27  /tmp/task12-green.patch' | sha256sum -c -
          patch --dry-run -p1 < /tmp/task12-green.patch
          patch -p1 < /tmp/task12-green.patch

      - name: Verify exact reviewed files and scope
        shell: bash
        run: |
          set -euo pipefail
          echo '93371b46f0a6a6d845044015fa50de087326d66640d90dbe5150a5f5d4d0a43c  src/services/claim-service.ts' | sha256sum -c -
          echo '210cd005ac0d87b8004d31a61c23ff4918363d8c9737942a3680d6ae078ce48a  src/services/recovery-service.ts' | sha256sum -c -
          echo 'c6a28317b09c4c5effab32c53d29789d44f5b64766e77565f22c79386117b08d  src/store/sqlite-store.ts' | sha256sum -c -
          echo '982d0567eea4d555e53d0b7203436662c6a26efc0299ed7a00442f89bc8c7102  tests/services/claim-service.test.ts' | sha256sum -c -
          echo '1a318d05857d5cf16c276ef66ae30729c0579112c85e9ce86ea07ea995567b5d  tests/services/recovery-service.test.ts' | sha256sum -c -
          paths=(
            src/services/claim-service.ts
            src/services/recovery-service.ts
            src/store/sqlite-store.ts
            tests/services/claim-service.test.ts
            tests/services/recovery-service.test.ts
          )
          expected=$'src/services/claim-service.ts\nsrc/services/recovery-service.ts\nsrc/store/sqlite-store.ts\ntests/services/claim-service.test.ts\ntests/services/recovery-service.test.ts'
          actual="$({
            git diff --name-only -- "${paths[@]}"
            git ls-files --others --exclude-standard -- "${paths[@]}"
          } | sort -u)"
          test "$actual" = "$expected"
          git diff --check
          test -z "$(git diff --name-only -- package.json package-lock.json migrations schema)"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Verify Task 12 directed matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run build --silent
          node --test \
            dist/tests/services/claim-service.test.js \
            dist/tests/services/recovery-service.test.js \
            | tee /tmp/task12-green.log
          grep -q 'tests 45' /tmp/task12-green.log
          grep -q 'pass 45' /tmp/task12-green.log
          grep -q 'fail 0' /tmp/task12-green.log

      - name: Verify complete canonical suite
        shell: bash
        run: npm run verify

      - name: Commit and publish reviewed GREEN
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .task12-publisher
          git config user.name 'developmentconexus-ops'
          git config user.email 'development.conexus@gmail.com'
          git add \
            src/services/claim-service.ts \
            src/services/recovery-service.ts \
            src/store/sqlite-store.ts \
            tests/services/claim-service.test.ts \
            tests/services/recovery-service.test.ts
          expected=$'src/services/claim-service.ts\nsrc/services/recovery-service.ts\nsrc/store/sqlite-store.ts\ntests/services/claim-service.test.ts\ntests/services/recovery-service.test.ts'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'feat: add Claims and read-only Recovery'
          git push origin HEAD:design/mis-002-m01
