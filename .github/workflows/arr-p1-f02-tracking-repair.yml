name: ARR P1 F02 Tracking Repair

on:
  push:
    branches:
      - reconcile/arr-p1-f02-tracking-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/arr-p1-f02-tracking-repair
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Restore verified B1/F02 test baseline and patch tracking assertions only
        shell: bash
        run: |
          set -euo pipefail
          git show d741b64b41bb04d4ceabaf0efa4b565a9d7e935e:scripts/test-documentation-tooling.mjs > scripts/test-documentation-tooling.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-documentation-tooling.mjs')
          s = p.read_text()
          replacements = [
            (
              "assert.match(statusText, /\\*\\*Current phase:\\*\\* `ARR P1 — P1-F02 Constitutional Body Reconciliation \\/ Fresh Review`/u, 'STATUS current phase must be P1-F02 fresh review');",
              "assert.match(statusText, /\\*\\*Current phase:\\*\\* `ARR P1 — Operator Acceptance Review`/u, 'STATUS current phase must be Operator P1 review');",
            ),
            (
              "assert.match(statusText, /ARR P1 A1-A4 \\+ B1 \\+ P1-F01 \\+ P1-F02:[^\\n]*IMPLEMENTED \\/ VERIFIED \\/ FRESH_REVIEW_REQUIRED/u, 'STATUS must record P1-F02 fresh-review state');",
              "assert.match(statusText, /ARR P1 A1-A4 \\+ B1 \\+ P1-F01 \\+ P1-F02:[^\\n]*IMPLEMENTED \\/ VERIFIED \\/ FRESH_REVIEW_PASSED \\/ OPERATOR_DECISION_REQUIRED/u, 'STATUS must record P1 review-ready state');",
            ),
            (
              "assert.match(statusText, /## Immediate next action — P1-F02 fresh review/u, 'STATUS next action must be P1-F02 fresh review');",
              "assert.match(statusText, /## Immediate next action — Operator P1 decision/u, 'STATUS next action must be Operator P1 decision');",
            ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing verified tracking assertion: {old}')
              s = s.replace(old, new, 1)
          anchor = "assert.match(statusText, /ARR-S0 harness implementation:[^\\n]*PROHIBITED pending GATE-S0-IMPLEMENT/u, 'STATUS must keep S0 implementation gated');"
          if anchor not in s:
              raise SystemExit('missing S0 gate assertion')
          review_assert = "assert.match(statusText, /P1-F02 fresh review:[^\\n]*Critical 0 \\/ Important 0[^\\n]*31194963494/u, 'STATUS must record F02 fresh-review evidence');"
          s = s.replace(anchor, review_assert + '\n' + anchor, 1)
          stale = "assert.doesNotMatch(statusText, /## Immediate next action — GATE-P0/u, 'STATUS must not point back to completed GATE-P0');"
          if stale not in s:
              raise SystemExit('missing stale GATE-P0 assertion')
          s = s.replace(stale, "assert.doesNotMatch(statusText, /## Immediate next action — P1-F02 fresh review/u, 'STATUS must not point to completed F02 fresh review');\n" + stale, 1)
          p.write_text(s)
          PY
      - name: Verify exact repair scope before tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "scripts/test-documentation-tooling.mjs "
      - name: Prove documentation GREEN
        run: npm run docs:test
      - name: Verify complete repository
        run: npm run verify
      - name: Remove transport-only workflow
        run: rm .github/workflows/arr-p1-f02-tracking-repair.yml
      - name: Commit verified repair tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'test: repair P1-F02 tracking closeout assertions'
          git push origin HEAD:reconcile/arr-p1-f02-tracking-repair
