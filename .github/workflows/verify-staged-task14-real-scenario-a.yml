name: Verify Staged Task 14 Real Scenario A Executor

on:
  push:
    branches:
      - automation/task14-real-scenario-a-verify
    paths:
      - .github/workflows/verify-staged-task14-real-scenario-a.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 42858b8a68cde3f56ee7d023eb10bdadebaecff0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Verify staged payload lineage and assemble exact executor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '42858b8a68cde3f56ee7d023eb10bdadebaecff0'
          git merge-base --is-ancestor '3adb12c42394cf0d54fb386b1b85d83c38f8903a' HEAD
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re

          def payload(path: Path) -> str:
              text = path.read_text(encoding='utf-8')
              match = re.search(r"^\s*PAYLOAD:\s*'([^']+)'\s*$", text, re.MULTILINE)
              if match is None:
                  raise SystemExit(f'missing PAYLOAD in {path}')
              return ''.join(match.group(1).split())

          encoded = ''.join(payload(Path(f'.github/workflows/task14-payload-executor-{index:02d}.yml')) for index in range(8))
          executor = gzip.decompress(base64.b64decode(encoded, validate=True))
          Path('/tmp/task14-real-scenario-a.mjs').write_bytes(executor)
          PY
          printf '%s  %s\n' \
            'e254c4ae6a7be7535f372e2beb15a7538e03d1a68c8e5bfb11f73fb1c178f1d2' \
            /tmp/task14-real-scenario-a.mjs \
            | sha256sum --check --strict
          node --check /tmp/task14-real-scenario-a.mjs

      - name: Verify frozen authorization and safety boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('/tmp/task14-real-scenario-a.mjs').read_text(encoding='utf-8')
          required = [
              "const AUTHORIZATION = 'MNFS_AUTHORIZE_M01_TASK_14_REAL_SCENARIO_A'",
              "const PLAN = '1.0.1'",
              "const MICRODESIGN = '0.6.1'",
              "const PR_HEAD = '3adb12c42394cf0d54fb386b1b85d83c38f8903a'",
              "const DETERMINISTIC_HEAD = '680b2e55d01f76da35922675c18ef997c56403d3'",
              "const PREFLIGHT_VERIFY_SHA = '08b1850ff7cc771ee25992fa77230ba8ed4831371c067f2d6cdec041ae01ad8b'",
              "const PREFLIGHT_DOCTOR_SHA = '3fe422cd4141d1d926dda2a3a6c52cd01e32861bb7fb3e6cb9378eabb4274193'",
              "const TREEHOUSE_EXECUTABLE_SHA = 'c0b45a6b7cd7ee5b79bd614136847d84b4c6c3fc8dbe0fd80b71703b7a102cf3'",
              "const RUN_BASE = join(homedir(), '.local', 'state', 'mnfs', 'task14-real-scenario-a')",
              'publishLeaseActionOperation',
              'LeaseActionRunner',
              'LeaseService',
              'RecoveryService',
              'TreehouseAdapter',
              'cleanupAuthorized: false',
              'MNFS_TASK14_REAL_SCENARIO_A_RESULT=PASS',
          ]
          for value in required:
              if value not in text:
                  raise SystemExit(f'missing required boundary: {value}')

          forbidden = {
              'recursive deletion': r'\b(?:rmSync|rmdirSync|unlinkSync)\b|\brm\s+-rf\b',
              'shell execution': r'shell\s*:\s*true|\bexec(?:File|Sync)?\s*\(',
              'Pi launch': r'\bspawn(?:Sync)?\s*\([^\n]*\bpi\b|\bimport\([^\n]*pi',
              'GitHub mutation': r'\bgh\s+(?:pr|issue|api|repo|workflow)\b',
              'automatic merge': r'\bgit\s+(?:merge|rebase|reset|clean)\b',
          }
          for label, pattern in forbidden.items():
              if re.search(pattern, text):
                  raise SystemExit(f'{label} found')

          if text.count("['get', '--lease', '--lease-holder', input.holder, '--json']") != 1:
              raise SystemExit('grant argv shape is not unique')
          if text.count("['return', input.worktreePath, '--if-lease-id', input.externalLeaseId, '--if-lease-holder', input.holder]") != 1:
              raise SystemExit('release argv shape is not unique')
          if re.search(r'(?:spawn|spawnSync|runSync|requireSync)\([^\n]*treehouse', text, re.I):
              raise SystemExit('direct Treehouse process launch found')
          if 'rmSync' in text or 'force: true' in text:
              raise SystemExit('fixture cleanup authority found')
          PY

      - name: Build and run executor self-test
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build --silent
          node /tmp/task14-real-scenario-a.mjs --self-test --repo "$GITHUB_WORKSPACE" \
            | tee /tmp/task14-real-self-test.log
          grep -Fq 'TASK14_REAL_SCENARIO_A_SELF_TEST=PASS' /tmp/task14-real-self-test.log

      - name: Re-run complete canonical deterministic gate
        shell: bash
        run: |
          set -euo pipefail
          npm run verify | tee /tmp/task14-real-verify.log
          grep -Fq 'tests 320' /tmp/task14-real-verify.log
          grep -Fq 'pass 320' /tmp/task14-real-verify.log
          grep -Fq 'tests 119' /tmp/task14-real-verify.log
          grep -Fq 'pass 119' /tmp/task14-real-verify.log
          grep -Fq 'tests 78' /tmp/task14-real-verify.log
          grep -Fq 'pass 78' /tmp/task14-real-verify.log
          grep -Fq 'Documentation validation passed (93 canonical IDs' /tmp/task14-real-verify.log
          ! grep -Eq 'fail [1-9][0-9]*' /tmp/task14-real-verify.log
          npm audit --audit-level=low
