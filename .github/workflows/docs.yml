name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.mnfs/**'
      - 'policies/**'
      - 'schemas/**'
      - 'spikes/arr-s0/**'
      - 'scripts/generate-*.mjs'
      - 'scripts/build-mis-002-replan.mjs'
      - 'scripts/sec-e1-policy.mjs'
      - 'scripts/validate-docs.mjs'
      - 'scripts/document-utils.mjs'
      - 'scripts/test-documentation-tooling.mjs'
      - 'scripts/test-mis-002-replan-builder.mjs'
      - 'scripts/test-approved-mis-002-allocations.mjs'
      - 'scripts/test-arr-p1-blueprint-reconciliation.mjs'
      - 'scripts/test-arr-spike-contract-binding.mjs'
      - 'scripts/test-arr-s0-contract-consistency.mjs'
      - 'scripts/run-arr-s0-tests.mjs'
      - 'README.md'
      - 'AGENTS.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.mnfs/**'
      - 'policies/**'
      - 'schemas/**'
      - 'spikes/arr-s0/**'
      - 'scripts/generate-*.mjs'
      - 'scripts/build-mis-002-replan.mjs'
      - 'scripts/sec-e1-policy.mjs'
      - 'scripts/validate-docs.mjs'
      - 'scripts/document-utils.mjs'
      - 'scripts/test-documentation-tooling.mjs'
      - 'scripts/test-mis-002-replan-builder.mjs'
      - 'scripts/test-approved-mis-002-allocations.mjs'
      - 'scripts/test-arr-p1-blueprint-reconciliation.mjs'
      - 'scripts/test-arr-spike-contract-binding.mjs'
      - 'scripts/test-arr-s0-contract-consistency.mjs'
      - 'scripts/run-arr-s0-tests.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - name: Baseline checkout clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Typecheck
        run: npm run typecheck
      - name: Checkout clean after typecheck
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Unit suite
        run: npm run test:unit
      - name: Checkout clean after unit suite
        run: test -z "$(git status --porcelain --untracked-files=all)"
        continue-on-error: true
      - name: AS-02 suite
        run: npm run test:as02
      - name: Checkout clean after AS-02
        run: test -z "$(git status --porcelain --untracked-files=all)"
        continue-on-error: true
      - name: TC-01 suite
        run: npm run test:tc01
      - name: Checkout clean after TC-01
        run: test -z "$(git status --porcelain --untracked-files=all)"
        continue-on-error: true
      - name: ARR-S0 suite
        run: npm run test:arr-s0
      - name: Checkout clean after ARR-S0
        run: test -z "$(git status --porcelain --untracked-files=all)"
        continue-on-error: true
      - name: Documentation test suite
        run: npm run docs:test
        continue-on-error: true
      - name: Documentation validator
        run: node scripts/validate-docs.mjs
        continue-on-error: true
