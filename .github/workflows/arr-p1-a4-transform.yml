name: ARR P1 A4 Transformer

on:
  push:
    branches:
      - reconcile/arr-p1-a4-transform

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/arr-p1-a4-transform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Regenerate canonical projections
        run: npm run docs:generate
      - name: Verify documentation contract
        run: |
          npm run docs:test
          npm run docs:check
      - name: Verify complete repository
        run: npm run verify
      - name: Remove transport-only workflow
        run: rm .github/workflows/arr-p1-a4-transform.yml
      - name: Commit only final A4 tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'docs: make ARR planning the canonical M2 path'
          git push origin HEAD:reconcile/arr-p1-a4-transform
