name: AS-02 Pi Pilot Patch

on:
  push:
    branches:
      - spike/as-02-local-sandbox
    paths:
      - .github/workflows/as02-pi-pilot-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/as-02-local-sandbox
          fetch-depth: 0
      - name: Integrate nonce-bound pilot
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('spikes/as-02/src/orchestrator-runtime.mjs')
          text = path.read_text()

          old_import = """} from './pi-inventory.mjs';
          import { runPerformanceSuite } from './performance.mjs';"""
          new_import = """} from './pi-inventory.mjs';
          import {
            createPiPilotChallenge,
            evaluatePiPilot,
            PI_PILOT_MODEL,
          } from './pi-pilot.mjs';
          import { runPerformanceSuite } from './performance.mjs';"""
          if text.count(old_import) != 1:
              raise SystemExit('unexpected pi pilot import shape')
          text = text.replace(old_import, new_import)

          old_runner = """  const receiptPath = join(pilotRoot, 'extension-receipt.json');
            const eventsPath = join(pilotRoot, 'extension-events.jsonl');
            const prompt = 'Use the read tool exactly once to read README.md. Then reply with only AS02_PI_PILOT_OK.';
            const args = [
              '--print',
              '--no-session',
              ...brokeredCandidateArgs(extensionPath),
              prompt,
            ];
            const result = await processRunner({
              file: 'pi',
              args,
              cwd: leasePath,
              env: {
                ...hostEnv,
                MNFS_AS02_POLICY_PATH: policyPath,
                MNFS_AS02_POLICY_HASH: policyHash,
                MNFS_AS02_WORKTREE: leasePath,
                MNFS_AS02_BROKER: brokerPath,
                MNFS_AS02_OPERATION_ROOT: operationRoot,
                MNFS_AS02_ARTIFACT_ROOT: artifactRoot,
                MNFS_AS02_EXTENSION_RECEIPT: receiptPath,
                MNFS_AS02_EXTENSION_EVENTS: eventsPath,
              },
              timeoutMs: 180_000,
              killProcessGroup: true,
            });"""
          new_runner = """  const receiptPath = join(pilotRoot, 'extension-receipt.json');
            const eventsPath = join(pilotRoot, 'extension-events.jsonl');
            const challenge = createPiPilotChallenge();
            const challengePath = join(leasePath, challenge.relativePath);
            await writeFile(challengePath, challenge.contents, { flag: 'wx', mode: 0o600 });
            const args = [
              '--print',
              '--no-session',
              '--model',
              PI_PILOT_MODEL,
              ...brokeredCandidateArgs(extensionPath),
              challenge.prompt,
            ];
            let result;
            try {
              result = await processRunner({
                file: 'pi',
                args,
                cwd: leasePath,
                env: {
                  ...hostEnv,
                  MNFS_AS02_POLICY_PATH: policyPath,
                  MNFS_AS02_POLICY_HASH: policyHash,
                  MNFS_AS02_WORKTREE: leasePath,
                  MNFS_AS02_BROKER: brokerPath,
                  MNFS_AS02_OPERATION_ROOT: operationRoot,
                  MNFS_AS02_ARTIFACT_ROOT: artifactRoot,
                  MNFS_AS02_EXTENSION_RECEIPT: receiptPath,
                  MNFS_AS02_EXTENSION_EVENTS: eventsPath,
                },
                timeoutMs: 180_000,
                killProcessGroup: true,
              });
            } finally {
              await rm(challengePath, { force: true });
            }"""
          if text.count(old_runner) != 1:
              raise SystemExit('unexpected pi pilot runner shape')
          text = text.replace(old_runner, new_runner)

          old_eval = """  const readEvents = events.filter((event) => event.tool === 'read' && event.result === 'SUCCEEDED');
            const otherEvents = events.filter((event) => event.tool !== 'read');
            const expectedTools = ['bash', 'read', 'write', 'edit', 'grep', 'find', 'ls'];
            const status = result.exitCode === 0 &&
              receipt?.policyHash === policyHash &&
              JSON.stringify(receipt?.tools) === JSON.stringify(expectedTools) &&
              readEvents.length === 1 &&
              otherEvents.length === 0
              ? 'PASS'
              : 'BLOCKED';"""
          new_eval = """  const evaluation = evaluatePiPilot({
              exitCode: result.exitCode,
              policyHash,
              receipt,
              events,
              stdout: stdout.bytes,
              expectedOutput: challenge.expectedOutput,
            });"""
          if text.count(old_eval) != 1:
              raise SystemExit('unexpected pi pilot evaluation shape')
          text = text.replace(old_eval, new_eval)

          old_evidence = """    status,
              exitCode: result.exitCode,
              signal: result.signal,
              policyHash,
              receiptPresent: receipt !== null,
              tools: receipt?.tools ?? [],
              successfulReadCalls: readEvents.length,
              otherToolCalls: otherEvents.map((event) => event.tool),"""
          new_evidence = """    status: evaluation.status,
              exitCode: result.exitCode,
              signal: result.signal,
              policyHash,
              model: PI_PILOT_MODEL,
              challengeHash: challenge.challengeHash,
              outputMatched: evaluation.outputMatched,
              receiptPresent: receipt !== null,
              tools: receipt?.tools ?? [],
              successfulReadCalls: evaluation.successfulReadCalls,
              otherToolCalls: evaluation.otherToolCalls,"""
          if text.count(old_evidence) != 1:
              raise SystemExit('unexpected pi pilot evidence shape')
          text = text.replace(old_evidence, new_evidence)

          path.write_text(text)
          Path('.github/workflows/as02-pi-pilot-patch.yml').unlink()
          PY
      - name: Commit exact patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add spikes/as-02/src/orchestrator-runtime.mjs .github/workflows/as02-pi-pilot-patch.yml
          git commit -m "fix(as02): require nonce-bound Pi read proof"
          git push origin HEAD:spike/as-02-local-sandbox
