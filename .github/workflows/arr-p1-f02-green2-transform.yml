name: ARR P1 F02 GREEN2 Transformer

on:
  push:
    branches:
      - reconcile/arr-p1-f02-green2-transform

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/arr-p1-f02-green2-transform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Syntax-check transport transformer
        run: python3 -m py_compile scripts/arr-p1-f02-green2-transform.py
      - name: Apply second P1-F02 cleanup
        run: python3 scripts/arr-p1-f02-green2-transform.py
      - name: Align tracking regression with active F02 review
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-documentation-tooling.mjs')
          s = p.read_text()
          replacements = [
            (
              "assert.match(statusText, /\\*\\*Current phase:\\*\\* `ARR P1 — Pre-Spike Reconciliation Review`/u, 'STATUS current phase must be P1 review');",
              "assert.match(statusText, /\\*\\*Current phase:\\*\\* `ARR P1 — P1-F02 Constitutional Body Reconciliation \\/ Fresh Review`/u, 'STATUS current phase must be P1-F02 fresh review');",
            ),
            (
              "assert.match(statusText, /ARR P1 A1-A4 \\+ B1 \\+ P1-F01:[^\\n]*IMPLEMENTED \\/ VERIFIED \\/ REVIEW_REQUIRED/u, 'STATUS must record P1 implementation review state');",
              "assert.match(statusText, /ARR P1 A1-A4 \\+ B1 \\+ P1-F01 \\+ P1-F02:[^\\n]*IMPLEMENTED \\/ VERIFIED \\/ FRESH_REVIEW_REQUIRED/u, 'STATUS must record P1-F02 fresh-review state');",
            ),
            (
              "assert.match(statusText, /## Immediate next action — P1 review/u, 'STATUS next action must be P1 review');",
              "assert.match(statusText, /## Immediate next action — P1-F02 fresh review/u, 'STATUS next action must be P1-F02 fresh review');",
            ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing tracking assertion: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Regenerate canonical projections
        run: npm run docs:generate
      - name: Locate exact residual aggregate phrases
        shell: bash
        run: |
          echo '=== one Pi Worker ==='
          grep -R -n -B2 -A2 -E '^one Pi Worker$' docs/product/blueprint || true
          echo '=== process adapter starts Pi Worker ==='
          grep -R -n -B2 -A2 -F 'process adapter starts Pi Worker' docs/product/blueprint || true
      - name: Prove strengthened F02 contract
        run: npm run docs:test
      - name: Validate complete documentation
        run: npm run docs:check
      - name: Verify complete repository
        run: npm run verify
      - name: Residual current-authority scan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
            'docs/product/blueprint/01-product-vision.md',
            'docs/product/blueprint/02-domain-model.md',
            'docs/product/blueprint/03-lifecycle-flows.md',
            'docs/product/blueprint/05-system-architecture.md',
            'docs/product/blueprint/06-roles-authority.md',
            'docs/product/blueprint/07-quality-evidence.md',
            'docs/product/blueprint/08-state-recovery.md',
            'docs/product/blueprint/09-context-memory.md',
            'docs/product/blueprint/10-security-isolation.md',
            'docs/product/blueprint/12-capability-roadmap.md',
            'docs/product/blueprint/13-documentation-governance.md',
          ]
          pat = re.compile(r'\b(?:Pi|Treehouse|E0|E1|E2|E3|E4|AB1|AS-01|AS-02|worktree|worktrees)\b', re.I)
          for rel in files:
              heading = '<frontmatter>'
              for n, line in enumerate(Path(rel).read_text().splitlines(), 1):
                  if line.startswith('#'):
                      heading = line
                  if pat.search(line):
                      print(f'{rel}:{n}\n  under: {heading}\n  text: {line}')
          PY
      - name: Remove transport-only machinery
        run: rm scripts/arr-p1-f02-green2-transform.py .github/workflows/arr-p1-f02-green2-transform.yml
      - name: Commit final verified F02 correction tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'docs: remove residual stale realization authority'
          git push origin HEAD:reconcile/arr-p1-f02-green2-transform
