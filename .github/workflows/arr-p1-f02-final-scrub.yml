name: ARR P1 F02 Final Scrub

on:
  push:
    branches:
      - reconcile/arr-p1-f02-green2-transform

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/arr-p1-f02-green2-transform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Remove transport bytecode and scrub remaining ambiguous current references
        shell: bash
        run: |
          rm -rf scripts/__pycache__
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing locus in {path}: {old}')
              p.write_text(s.replace(old, new, 1))

          replace(
              'docs/product/blueprint/09-context-memory.md',
              '- Pi resume;\n- OM;\n- Current Authority Snapshot.',
              '- runtime-native resume when the selected Agent Runtime supports it;\n- optional Session Memory Adapter when separately applicable;\n- Current Authority Snapshot.\n\nRuntime-native resume is a convenience only; it never replaces Fresh Recovery or current Authority.',
          )
          replace(
              'docs/product/blueprint/05-system-architecture.md',
              'Herdr fornece workspaces, tabs, panes, persistência de terminal e estado visual de agentes; também expõe CLI e socket API para controle e possui integração direta com Pi. citeturn823284search1turn823284search2turn823284search5',
              'Herdr fornece workspaces, tabs, panes, persistência de terminal e estado visual de agentes; também expõe CLI e socket API para controle. A versão estudada historicamente possuía integração direta com Pi; isso é reference compatibility e não seleciona Pi como Agent Runtime atual. citeturn823284search1turn823284search2turn823284search5',
          )
          replace(
              'docs/product/blueprint/05-system-architecture.md',
              'Vive fora dos worktrees:',
              'Vive fora dos isolated mutable workspaces:',
          )
          replace(
              'docs/product/blueprint/05-system-architecture.md',
              '- custom worktree manager;',
              '- custom mutable-workspace manager;',
          )

          p = Path('scripts/test-arr-p1-blueprint-reconciliation.mjs')
          s = p.read_text()
          marker = "reject('09-context-memory.md', /process adapter starts Pi Worker with Dispatch Packet/u, 'current M2 communication model still selects Pi Worker');"
          if marker not in s:
              raise SystemExit('missing Section 09 test insertion marker')
          addition = marker + "\nreject('09-context-memory.md', /^- Pi resume;$/mu, 'current Session handoff still selects Pi-native resume');"
          s = s.replace(marker, addition, 1)
          p.write_text(s)
          PY
      - name: Regenerate projections
        run: npm run docs:generate
      - name: Prove F02 regression contract
        run: npm run docs:test
      - name: Verify complete repository
        run: npm run verify
      - name: Final residual scan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
            'docs/product/blueprint/01-product-vision.md',
            'docs/product/blueprint/02-domain-model.md',
            'docs/product/blueprint/03-lifecycle-flows.md',
            'docs/product/blueprint/05-system-architecture.md',
            'docs/product/blueprint/06-roles-authority.md',
            'docs/product/blueprint/07-quality-evidence.md',
            'docs/product/blueprint/08-state-recovery.md',
            'docs/product/blueprint/09-context-memory.md',
            'docs/product/blueprint/10-security-isolation.md',
            'docs/product/blueprint/12-capability-roadmap.md',
            'docs/product/blueprint/13-documentation-governance.md',
          ]
          pat = re.compile(r'\b(?:Pi|Treehouse|E0|E1|E2|E3|E4|AB1|AS-01|AS-02|worktree|worktrees)\b', re.I)
          for rel in files:
              heading = '<frontmatter>'
              for n, line in enumerate(Path(rel).read_text().splitlines(), 1):
                  if line.startswith('#'):
                      heading = line
                  if pat.search(line):
                      print(f'{rel}:{n}\n  under: {heading}\n  text: {line}')
          PY
      - name: Remove transport-only workflow
        run: rm .github/workflows/arr-p1-f02-final-scrub.yml
      - name: Commit verified clean F02 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git ls-files | grep -q '__pycache__\|\.pyc$'; then
            echo 'transport bytecode remains tracked' >&2
            exit 1
          fi
          git diff --cached --stat
          git commit -m 'docs: close remaining P1-F02 authority ambiguity'
          git push origin HEAD:reconcile/arr-p1-f02-green2-transform
