name: Apply Task 13 GREEN Review Fixes v2

on:
  push:
    branches:
      - automation/task13-green-work
    paths:
      - .github/workflows/task13-green-apply-review-fixes-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/task13-green-work
          fetch-depth: 0

      - name: Reuse reviewed patch with structural Recovery matcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/task13-green-apply-review-fixes.yml')
          source = workflow.read_text(encoding='utf-8')
          begin_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          begin = source.index(begin_marker) + len(begin_marker)
          end = source.index(end_marker, begin)
          script = textwrap.dedent(source[begin:end])

          old_start = script.index("old_recovery = '''")
          old_end = script.index("path.write_text(text, encoding='utf-8')", old_start)
          structural = '''recovery_start = text.index(
              '  const leases: RecoveryLeaseCandidate[] = [];',
              text.index('async function recoveryObservation'),
          )
          recovery_end = text.index(
              '\\n\\n  const actions: RecoveryActionCandidate[] = [];',
              recovery_start,
          )
          recovery_block = """  const leases: RecoveryLeaseCandidate[] = [];
          if (
            track !== undefined
            && attempt !== undefined
            && attempt.sourceStatus === 'READY'
            && attempt.sourcePath !== undefined
            && existsSync(attempt.sourcePath)
          ) {
            if (await canObservePhysicalWithoutMutation(context, track, attempt)) {
              try {
                const runtime = await attemptPhysicalRuntime(context, track, attempt, false);
                for (const candidate of await treehouseCandidates(runtime, lease)) leases.push(candidate);
                sources[0] = {
                  status: 'READY',
                  attemptId: attempt.id,
                  path: runtime.source.path,
                  fingerprint: runtime.source.fingerprint,
                  baseCommitSha: runtime.source.baseCommitSha,
                  baseTreeSha: runtime.source.baseTreeSha,
                  objectFormat: runtime.source.objectFormat,
                };
              } catch {
                sources[0] = {
                  ...sourceObservationFromAttempt(attempt),
                  status: 'UNKNOWN',
                };
              }
            } else {
              sources[0] = {
                ...sourceObservationFromAttempt(attempt),
                status: 'UNKNOWN',
              };
            }
          }"""
          text = text[:recovery_start] + recovery_block + text[recovery_end:]

          '''
          script = script[:old_start] + structural + script[old_end:]
          exec(compile(script, '<task13-reviewed-patch>', 'exec'), {})
          PY

          git config user.name developmentconexus-ops
          git config user.email development.conexus@gmail.com
          git add src/cli/entry.ts
          git rm \
            .github/workflows/task13-green-apply-review-fixes.yml \
            .github/workflows/task13-green-apply-review-fixes-v2.yml
          git diff --cached --check
          git commit -m 'work: harden Task 13 production composition'
          git push origin HEAD:automation/task13-green-work
