name: Publish Reviewed Task 13 RED Tracking

on:
  push:
    branches:
      - automation/task13-red-publish
    paths:
      - .github/workflows/publish-task13-red-tracking-v2.yml

permissions:
  contents: write

concurrency:
  group: publish-reviewed-task13-red-tracking
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reviewed Task 13 RED head
        uses: actions/checkout@v4
        with:
          ref: design/mis-002-m01
          fetch-depth: 0

      - name: Set up accepted Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Verify reviewed RED lineage and tracking preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'fe6da615d2d0a32437e2adb0627f09a693f1bd57'
          test "$(git rev-parse HEAD^)" = '7872071c6ed7238ec0cb8dc55e613d25d1f6d9fd'
          git merge-base --is-ancestor '8c6fd9afa2cc7f707f96659b9efa73230579471a' HEAD
          git merge-base --is-ancestor '956a067336df48f54d19e634666f14bdf5a92143' HEAD
          test "$(git hash-object docs/tracking/STATUS.md)" = 'fd47e6681d0f9d44b810696cf518c4220c3f2636'
          test "$(git show --format= --name-only HEAD | sort)" = 'tests/cli/execution-red-review.test.ts'
          echo '4ed469cd00cf105a24b3e093cd537c5bc45ed07ecfc952ad99f5ea25ac8d4825  tests/cli/execution-red-review.test.ts' | sha256sum -c -

      - name: Checkout reviewed tracking updater
        uses: actions/checkout@v4
        with:
          ref: automation/task13-red-publish
          path: .task13-reviewed-tracking
          fetch-depth: 1

      - name: Record reviewed Task 13 RED evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .task13-reviewed-tracking hash-object .github/task13-red/update-reviewed-status.py)" = '7ed55c8fb49650e3df210acfe6b6e6150eec55cc'
          python3 .task13-reviewed-tracking/.github/task13-red/update-reviewed-status.py
          rm -rf .task13-reviewed-tracking
          test "$(git diff --name-only)" = 'docs/tracking/STATUS.md'
          git diff --check
          grep -q '^version: 1.8.47$' docs/tracking/STATUS.md
          grep -q 'Task 13 RED:.*OBSERVED / ACCEPTABLE' docs/tracking/STATUS.md
          grep -q 'Task 13 GREEN awaits explicit authority' docs/tracking/STATUS.md
          grep -q 'Reviewed RED:  fe6da615d2d0a32437e2adb0627f09a693f1bd57' docs/tracking/STATUS.md
          grep -q '31031446681 / 92392885796' docs/tracking/STATUS.md
          grep -q 'Task 13 RED:         0/12 PASS' docs/tracking/STATUS.md
          grep -q '290 PASS / 12 expected FAIL / 302 total' docs/tracking/STATUS.md
          grep -q 'reviewed Task 13 RED head `fe6da615d2d0a32437e2adb0627f09a693f1bd57`' docs/tracking/STATUS.md

      - name: Verify baseline and reviewed expected RED with tracking
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run build --silent

          set +e
          node --test \
            dist/tests/cli/execution-args.test.js \
            dist/tests/cli/execution-main.test.js \
            dist/tests/cli/execution-red-review.test.js \
            > /tmp/task13-reviewed-tracking-directed.log 2>&1
          directed_status=$?
          node scripts/run-tests.mjs > /tmp/task13-reviewed-tracking-product.log 2>&1
          product_status=$?
          set -e

          cat /tmp/task13-reviewed-tracking-directed.log
          test "$directed_status" -ne 0
          grep -q 'tests 12' /tmp/task13-reviewed-tracking-directed.log
          grep -q 'pass 0' /tmp/task13-reviewed-tracking-directed.log
          grep -q 'fail 12' /tmp/task13-reviewed-tracking-directed.log
          grep -q 'M01 execution CLI parser is not implemented' /tmp/task13-reviewed-tracking-directed.log
          grep -q 'M01 execution CLI dispatch is not implemented' /tmp/task13-reviewed-tracking-directed.log
          grep -q 'M01 production composition root is not implemented' /tmp/task13-reviewed-tracking-directed.log

          cat /tmp/task13-reviewed-tracking-product.log
          test "$product_status" -ne 0
          grep -q 'tests 302' /tmp/task13-reviewed-tracking-product.log
          grep -q 'pass 290' /tmp/task13-reviewed-tracking-product.log
          grep -q 'fail 12' /tmp/task13-reviewed-tracking-product.log

          node scripts/run-as02-tests.mjs > /tmp/task13-reviewed-tracking-as02.log 2>&1
          grep -q 'tests 119' /tmp/task13-reviewed-tracking-as02.log
          grep -q 'pass 119' /tmp/task13-reviewed-tracking-as02.log
          grep -q 'fail 0' /tmp/task13-reviewed-tracking-as02.log

          node scripts/run-tc01-tests.mjs > /tmp/task13-reviewed-tracking-tc01.log 2>&1
          grep -q 'tests 78' /tmp/task13-reviewed-tracking-tc01.log
          grep -q 'pass 78' /tmp/task13-reviewed-tracking-tc01.log
          grep -q 'fail 0' /tmp/task13-reviewed-tracking-tc01.log

          npm run docs:check > /tmp/task13-reviewed-tracking-docs.log 2>&1
          cat /tmp/task13-reviewed-tracking-docs.log
          grep -q 'Documentation validation passed (93 canonical IDs' /tmp/task13-reviewed-tracking-docs.log

      - name: Commit and publish reviewed Task 13 RED tracking
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'developmentconexus-ops'
          git config user.email 'development.conexus@gmail.com'
          git add docs/tracking/STATUS.md
          test "$(git diff --cached --name-only)" = 'docs/tracking/STATUS.md'
          git diff --cached --check
          git commit -m 'docs: record reviewed Task 13 RED evidence'
          git push origin HEAD:design/mis-002-m01
