name: Publish Task 12 GREEN

on:
  push:
    branches:
      - automation/task12-green-publish
    paths:
      - .github/workflows/publish-task12-green.yml

permissions:
  contents: write

concurrency:
  group: publish-task12-green
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout accepted Task 12 branch
        uses: actions/checkout@v4
        with:
          ref: design/mis-002-m01
          fetch-depth: 0

      - name: Checkout reviewed tracking update
        uses: actions/checkout@v4
        with:
          ref: automation/task12-green-publish
          path: .task12-publisher
          fetch-depth: 1

      - name: Set up accepted Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Verify accepted implementation and tracking baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '8c6fd9afa2cc7f707f96659b9efa73230579471a'
          test "$(git hash-object docs/tracking/STATUS.md)" = 'e7084a7617a399dbf07fed2c8af9410c47d36800'
          test "$(git -C .task12-publisher hash-object .github/update-task12-final-tracking.py)" = 'a26925acff2cc4ecaf7d51782dec063d20a4d1f4'

      - name: Apply final Task 12 tracking update
        shell: bash
        run: |
          set -euo pipefail
          python3 .task12-publisher/.github/update-task12-final-tracking.py
          test "$(git diff --name-only)" = 'docs/tracking/STATUS.md'
          git diff --check
          grep -q '^version: 1.8.45$' docs/tracking/STATUS.md
          grep -q 'Task 12  Claim OPEN and read-only Recovery     8c6fd9afa2cc7f707f96659b9efa73230579471a' docs/tracking/STATUS.md
          grep -q 'Task 12:               50/50 PASS' docs/tracking/STATUS.md
          grep -q 'Product:               290/290 PASS' docs/tracking/STATUS.md
          grep -q 'Correction Run/Job:    31028279068 / 92382202637' docs/tracking/STATUS.md

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Verify complete canonical suite with final tracking
        shell: bash
        run: npm run verify

      - name: Commit and publish final tracking evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .task12-publisher
          git config user.name 'developmentconexus-ops'
          git config user.email 'development.conexus@gmail.com'
          git add docs/tracking/STATUS.md
          test "$(git diff --cached --name-only)" = 'docs/tracking/STATUS.md'
          git diff --cached --check
          git commit -m 'docs: record final Task 12 review evidence'
          git push origin HEAD:design/mis-002-m01
