name: Task 13 Directed Diagnostic

on:
  push:
    branches:
      - automation/task13-green-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/task13-green-diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Capture exact directed diagnostics
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build --silent
          set +e
          node --test \
            dist/tests/cli/execution-args.test.js \
            dist/tests/cli/execution-main.test.js \
            dist/tests/cli/execution-red-review.test.js \
            dist/tests/cli/execution-green-review.test.js \
            > /tmp/directed.log 2>&1
          status=$?
          set -e
          cat /tmp/directed.log
          exit "$status"
