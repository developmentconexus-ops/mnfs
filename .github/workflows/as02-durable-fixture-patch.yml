name: AS-02 Durable Fixture Patch

on:
  push:
    branches:
      - spike/as-02-local-sandbox
    paths:
      - .github/workflows/as02-durable-fixture-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/as-02-local-sandbox
          fetch-depth: 0
      - name: Replace ephemeral fixture base
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('spikes/as-02/src/orchestrator-runtime.mjs')
          text = path.read_text()

          replacements = [
              (
                  "  resolveAs02ArtifactBase,\n  scenarioSignature,",
                  "  resolveAs02ArtifactBase,\n  resolveAs02FixtureBase,\n  scenarioSignature,",
              ),
              ("const FIXTURE_BASE = '/tmp/mnfs-as-02';\n", ""),
              (
                  "  let artifactBase;\n  let storePromise;",
                  "  let artifactBase;\n  let fixtureBase;\n  let storePromise;",
              ),
              (
                  "      artifactBase = resolveAs02ArtifactBase(env, homeDirectory);\n    }\n    return { repositoryPath, artifactBase };",
                  "      artifactBase = resolveAs02ArtifactBase(env, homeDirectory);\n      fixtureBase = resolveAs02FixtureBase(env, homeDirectory);\n    }\n    return { repositoryPath, artifactBase, fixtureBase };",
              ),
              (
                  "    const { repositoryPath: repo, artifactBase: base } = await paths();\n    await mkdir(FIXTURE_BASE, { recursive: true, mode: 0o700 });",
                  "    const { repositoryPath: repo, artifactBase: base, fixtureBase: durableFixtureBase } = await paths();\n    await mkdir(durableFixtureBase, { recursive: true, mode: 0o700 });",
              ),
              (
                  "    const fixtureRoot = join(FIXTURE_BASE, runId);",
                  "    const fixtureRoot = join(durableFixtureBase, runId);",
              ),
              (
                  "      const fixture = await fixtureFactory({ baseRoot: FIXTURE_BASE, runId, runner: processRunner });",
                  "      const fixture = await fixtureFactory({ baseRoot: durableFixtureBase, runId, runner: processRunner });",
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected runtime shape for: {old!r}')
              text = text.replace(old, new)

          if '/tmp/mnfs-as-02' in text:
              raise SystemExit('ephemeral fixture base remains in runtime')

          path.write_text(text)
          Path('.github/workflows/as02-durable-fixture-patch.yml').unlink()
          PY
      - name: Commit exact patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add spikes/as-02/src/orchestrator-runtime.mjs .github/workflows/as02-durable-fixture-patch.yml
          git commit -m "fix(as02): persist fixture across WSL restart"
          git push origin HEAD:spike/as-02-local-sandbox
