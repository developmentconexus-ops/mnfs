name: Publish authorized Task 12 RED

on:
  push:
    branches:
      - automation/task12-red-publish
    paths:
      - .github/workflows/publish-task12-red.yml

permissions:
  contents: write

concurrency:
  group: publish-task12-red
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout authorized target branch
        uses: actions/checkout@v4
        with:
          ref: design/mis-002-m01
          fetch-depth: 0

      - name: Set up accepted Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Verify authorized target head
        shell: bash
        run: |
          set -euo pipefail
          expected='f46497d9b10c6abd453f1902ec4178d9e51aa454'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Verify accepted Tasks 1-11 baseline
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify

      - name: Decode Task 12 RED matrices
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/task12-red-tests.tar.gz.b64 <<'TASK12_RED_PAYLOAD'

TASK12_RED_PAYLOAD
          base64 -d /tmp/task12-red-tests.tar.gz.b64 > /tmp/task12-red-tests.tar.gz
          echo '2f7111b8fe23ab35fd52085f31e780f3b07d1f38adb52bb43f8f3e21251566a9  /tmp/task12-red-tests.tar.gz' | sha256sum -c -
          tar -xzf /tmp/task12-red-tests.tar.gz -C tests/services

      - name: Verify Task 12 RED signatures
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          set +e
          npm run build --silent && node --test \
            dist/tests/services/claim-service.test.js \
            dist/tests/services/recovery-service.test.js \
            > /tmp/task12-red.log 2>&1
          status=$?
          set -e
          cat /tmp/task12-red.log
          test "$status" -ne 0
          grep -q 'M01 ClaimService is not implemented' /tmp/task12-red.log
          grep -q 'M01 RecoveryService is not implemented' /tmp/task12-red.log
          test ! -e src/services/claim-service.ts
          test ! -e src/services/recovery-service.ts

      - name: Commit and publish authorized RED tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'developmentconexus-ops'
          git config user.email 'development.conexus@gmail.com'
          git add \
            tests/services/claim-service.test.ts \
            tests/services/recovery-service.test.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'test: define Task 12 Claim and Recovery RED'
          git push origin HEAD:design/mis-002-m01
