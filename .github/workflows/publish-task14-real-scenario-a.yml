name: Publish Task 14 Real Scenario A Executor

on:
  push:
    branches:
      - automation/task14-real-scenario-a
    paths:
      - .github/workflows/publish-task14-real-scenario-a.yml

permissions:
  contents: write

concurrency:
  group: publish-task14-real-scenario-a
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Verify exact authorized publisher lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '3adb12c42394cf0d54fb386b1b85d83c38f8903a'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/publish-task14-real-scenario-a.yml'
          test "$(git status --porcelain)" = ''

      - name: Materialize immutable executor and verifier
        shell: bash
        env:
          EXECUTOR_GZ_B64: ''}
          VERIFIER_GZ_B64: ''
        run: |
          set -euo pipefail
          mkdir -p .github/real-proof .github/workflows
          printf '%s' "$EXECUTOR_GZ_B64" | base64 --decode | gzip --decompress > .github/real-proof/task14-real-scenario-a.mjs
          printf '%s' "$VERIFIER_GZ_B64" | base64 --decode | gzip --decompress > .github/workflows/verify-task14-real-scenario-a.yml
          chmod 0644 .github/real-proof/task14-real-scenario-a.mjs .github/workflows/verify-task14-real-scenario-a.yml
          printf '%s  %s
' \
            'e254c4ae6a7be7535f372e2beb15a7538e03d1a68c8e5bfb11f73fb1c178f1d2' \
            .github/real-proof/task14-real-scenario-a.mjs \
            | sha256sum --check --strict
          printf '%s  %s
' \
            '463557a9e731811de451f9b0980d51baac23e8fe2c16e10dfe4a07f694d2e782' \
            .github/workflows/verify-task14-real-scenario-a.yml \
            | sha256sum --check --strict
          node --check .github/real-proof/task14-real-scenario-a.mjs
          git diff --check

      - name: Publish one bounded automation commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/task14-real-scenario-a
          test "$(git rev-parse origin/automation/task14-real-scenario-a)" = "$(git rev-parse HEAD)"
          git config user.name 'developmentconexus-ops'
          git config user.email 'development.conexus@gmail.com'
          git rm .github/workflows/publish-task14-real-scenario-a.yml
          git add .github/real-proof/task14-real-scenario-a.mjs .github/workflows/verify-task14-real-scenario-a.yml
          expected=$'.github/real-proof/task14-real-scenario-a.mjs
.github/workflows/publish-task14-real-scenario-a.yml
.github/workflows/verify-task14-real-scenario-a.yml'
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git diff --cached --check
          git commit -m 'automation: add Task 14 real Scenario A executor'
          test "$(git diff --name-only 3adb12c42394cf0d54fb386b1b85d83c38f8903a..HEAD | sort)" = $'.github/real-proof/task14-real-scenario-a.mjs
.github/workflows/verify-task14-real-scenario-a.yml'
          git push origin HEAD:automation/task14-real-scenario-a
          echo "Published executor: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
