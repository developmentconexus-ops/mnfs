name: Conexus 3L Package B

on:
  pull_request:
    paths:
      - 'spikes/conexus-3l-b/**'
      - 'docs/conexus/phase3/3L-B-product-agent-cross-runtime-qualification.md'
      - 'docs/conexus/phase3/3L-B-proof-routing-amendment.md'
      - 'docs/conexus/phase3/3L-B-technology-qualification.md'
      - 'docs/conexus/phase3/3L-B0-admission-record.md'
      - 'docs/conexus/phase3/3L-B0-lead-adjudication.md'
      - 'docs/conexus/current/README.md'
      - 'docs/conexus/current/ARCHITECTURE-BASELINE.md'
      - 'docs/conexus/phase3/LEDGER.md'
      - '.github/workflows/conexus-3l-b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b0-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: conexus_b
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conexus_b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/conexus_b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install exact Package-B lock without lifecycle scripts
        working-directory: spikes/conexus-3l-b
        run: npm ci --ignore-scripts --audit=false --fund=false
      - name: Verify Package-B evidence through the BT-3 stop boundary
        working-directory: spikes/conexus-3l-b
        run: npm run verify
