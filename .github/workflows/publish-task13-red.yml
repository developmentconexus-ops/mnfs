name: Publish Task 13 RED

on:
  push:
    branches:
      - automation/task13-red-publish
    paths:
      - .github/workflows/publish-task13-red.yml

permissions:
  contents: write

concurrency:
  group: publish-task13-red
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed Task 13 RED head
        uses: actions/checkout@v4
        with:
          ref: design/mis-002-m01
          fetch-depth: 0

      - name: Set up accepted Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Verify exact initial RED and accepted Task 12 ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '956a067336df48f54d19e634666f14bdf5a92143'
          git merge-base --is-ancestor '8c6fd9afa2cc7f707f96659b9efa73230579471a' HEAD
          test "$(git rev-parse HEAD^)" = '39a7bdcaa351ec5212b53018595cbf34aae2e476'
          test "$(git hash-object tests/cli/execution-args.test.ts)" = 'bf22293f55983c12450dc81bafe5df31be5457c8'
          test "$(git hash-object tests/cli/execution-main.test.ts)" = '792fc7907aa12672532893558b98a99b9dd70a34'
          echo '41780ce86b69a97979c56e21562ea7acf0380003ceca8a2223583af0b4820b15  tests/cli/execution-args.test.ts' | sha256sum -c -
          echo 'ec50c6683b9115ea84e9d148efa9cd2029ba02b468bc4a1e1d24d65054663f29  tests/cli/execution-main.test.ts' | sha256sum -c -
          test ! -e tests/cli/execution-red-review.test.ts

      - name: Verify accepted Tasks 1-12 baseline without Task 13 tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          temporary="$(mktemp -d)"
          restore_red_tests() {
            if test -e "$temporary/execution-args.test.ts"; then
              mv "$temporary/execution-args.test.ts" tests/cli/execution-args.test.ts
            fi
            if test -e "$temporary/execution-main.test.ts"; then
              mv "$temporary/execution-main.test.ts" tests/cli/execution-main.test.ts
            fi
            rm -rf "$temporary"
          }
          trap restore_red_tests EXIT
          mv tests/cli/execution-args.test.ts "$temporary/execution-args.test.ts"
          mv tests/cli/execution-main.test.ts "$temporary/execution-main.test.ts"

          npm run typecheck
          npm run build --silent
          node scripts/run-tests.mjs > /tmp/task13-reviewed-baseline-product.log 2>&1
          cat /tmp/task13-reviewed-baseline-product.log
          grep -q 'tests 290' /tmp/task13-reviewed-baseline-product.log
          grep -q 'pass 290' /tmp/task13-reviewed-baseline-product.log
          grep -q 'fail 0' /tmp/task13-reviewed-baseline-product.log

          node scripts/run-as02-tests.mjs > /tmp/task13-reviewed-baseline-as02.log 2>&1
          cat /tmp/task13-reviewed-baseline-as02.log
          grep -q 'tests 119' /tmp/task13-reviewed-baseline-as02.log
          grep -q 'pass 119' /tmp/task13-reviewed-baseline-as02.log
          grep -q 'fail 0' /tmp/task13-reviewed-baseline-as02.log

          node scripts/run-tc01-tests.mjs > /tmp/task13-reviewed-baseline-tc01.log 2>&1
          cat /tmp/task13-reviewed-baseline-tc01.log
          grep -q 'tests 78' /tmp/task13-reviewed-baseline-tc01.log
          grep -q 'pass 78' /tmp/task13-reviewed-baseline-tc01.log
          grep -q 'fail 0' /tmp/task13-reviewed-baseline-tc01.log

          npm run docs:check > /tmp/task13-reviewed-baseline-docs.log 2>&1
          cat /tmp/task13-reviewed-baseline-docs.log
          grep -q 'Documentation validation passed (93 canonical IDs' /tmp/task13-reviewed-baseline-docs.log

          restore_red_tests
          trap - EXIT
          test "$(git hash-object tests/cli/execution-args.test.ts)" = 'bf22293f55983c12450dc81bafe5df31be5457c8'
          test "$(git hash-object tests/cli/execution-main.test.ts)" = '792fc7907aa12672532893558b98a99b9dd70a34'

      - name: Checkout Task 13 RED review payload
        uses: actions/checkout@v4
        with:
          ref: automation/task13-red-publish
          path: .task13-review-publisher
          fetch-depth: 1

      - name: Install exact test-only review payload
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tests/cli/execution-red-review.test.ts
          echo '4ed469cd00cf105a24b3e093cd537c5bc45ed07ecfc952ad99f5ea25ac8d4825  .task13-review-publisher/.github/task13-red/execution-red-review.test.ts' | sha256sum -c -
          cp \
            .task13-review-publisher/.github/task13-red/execution-red-review.test.ts \
            tests/cli/execution-red-review.test.ts
          rm -rf .task13-review-publisher
          echo '4ed469cd00cf105a24b3e093cd537c5bc45ed07ecfc952ad99f5ea25ac8d4825  tests/cli/execution-red-review.test.ts' | sha256sum -c -
          test "$(git ls-files --others --exclude-standard -- tests/cli | sort)" = \
            'tests/cli/execution-red-review.test.ts'

      - name: Verify reviewed Task 13 directed RED signatures
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build --silent
          set +e
          node --test \
            dist/tests/cli/execution-args.test.js \
            dist/tests/cli/execution-main.test.js \
            dist/tests/cli/execution-red-review.test.js \
            > /tmp/task13-reviewed-red-directed.log 2>&1
          status=$?
          set -e
          cat /tmp/task13-reviewed-red-directed.log
          test "$status" -ne 0
          grep -q 'M01 execution CLI parser is not implemented' /tmp/task13-reviewed-red-directed.log
          grep -q 'M01 execution CLI dispatch is not implemented' /tmp/task13-reviewed-red-directed.log
          grep -q 'M01 production composition root is not implemented' /tmp/task13-reviewed-red-directed.log
          grep -q 'tests 12' /tmp/task13-reviewed-red-directed.log
          grep -q 'pass 0' /tmp/task13-reviewed-red-directed.log
          grep -q 'fail 12' /tmp/task13-reviewed-red-directed.log

      - name: Verify prior product baseline remains green inside reviewed RED suite
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/run-tests.mjs > /tmp/task13-reviewed-red-product.log 2>&1
          status=$?
          set -e
          cat /tmp/task13-reviewed-red-product.log
          test "$status" -ne 0
          grep -q 'tests 302' /tmp/task13-reviewed-red-product.log
          grep -q 'pass 290' /tmp/task13-reviewed-red-product.log
          grep -q 'fail 12' /tmp/task13-reviewed-red-product.log
          grep -q 'M01 execution CLI parser is not implemented' /tmp/task13-reviewed-red-product.log
          grep -q 'M01 execution CLI dispatch is not implemented' /tmp/task13-reviewed-red-product.log
          grep -q 'M01 production composition root is not implemented' /tmp/task13-reviewed-red-product.log
          test "$(git rev-parse HEAD)" = '956a067336df48f54d19e634666f14bdf5a92143'

      - name: Commit and publish reviewed Task 13 RED matrix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'developmentconexus-ops'
          git config user.email 'development.conexus@gmail.com'
          git add tests/cli/execution-red-review.test.ts
          test "$(git diff --cached --name-only)" = \
            'tests/cli/execution-red-review.test.ts'
          git diff --cached --check
          git commit -m 'test: strengthen Task 13 execution CLI RED'
          git push origin HEAD:design/mis-002-m01
