name: Publish Task 12 GREEN

on:
  push:
    branches:
      - automation/task12-green-publish
    paths:
      - .github/workflows/publish-task12-green.yml

permissions:
  contents: write

concurrency:
  group: publish-task12-green
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout authorized target branch
        uses: actions/checkout@v4
        with:
          ref: design/mis-002-m01
          fetch-depth: 0

      - name: Checkout reviewed GREEN payload
        uses: actions/checkout@v4
        with:
          ref: automation/task12-green-publish
          path: .task12-publisher
          fetch-depth: 1

      - name: Set up accepted Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Verify authorized target head
        shell: bash
        run: |
          set -euo pipefail
          expected='eb49a1eaa251f4bc5b1cb0dedc49f6de2cbc0dc0'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Reconstruct and verify reviewed GREEN patch
        shell: bash
        run: |
          set -euo pipefail
          payload='.task12-publisher/.github/task12-green-v3.patch.xz.b64'
          echo 'c97a181701487a592b96833f611c95c2363d40e0fca8fca60e9ab2719c117f4a  .task12-publisher/.github/task12-green-v3.patch.xz.b64' | sha256sum -c -
          base64 --decode "$payload" > /tmp/task12-green.patch.xz
          echo 'bc5457c3ea5102b708d88db33146c81d9b197a1cd084ec7e223497a15e2ab111  /tmp/task12-green.patch.xz' | sha256sum -c -
          xz --decompress --stdout /tmp/task12-green.patch.xz > /tmp/task12-green.patch
          echo 'c403d73126fca4f40a6ac4e10d873aff133450b4b658c769d32b2ebafe5868e0  /tmp/task12-green.patch' | sha256sum -c -
          git apply --check /tmp/task12-green.patch
          git apply /tmp/task12-green.patch

      - name: Verify exact reviewed files and scope
        shell: bash
        run: |
          set -euo pipefail
          echo 'befcd24b0e4991f4db00cc63ff5f29d1d7f7841e5a25af0403c328d27fbb4384  src/services/claim-service.ts' | sha256sum -c -
          echo 'e6dcbaf204efab628825f5a3b4d4ab9f3ac9f0b302a5533b19d23421537b4339  src/services/recovery-service.ts' | sha256sum -c -
          echo 'c6a28317b09c4c5effab32c53d29789d44f5b64766e77565f22c79386117b08d  src/store/sqlite-store.ts' | sha256sum -c -
          echo '7658ad0525d2eb4f53bc5ef21dff2880d42ca1f80edce2eca2b336e467c9967f  tests/services/claim-service.test.ts' | sha256sum -c -
          echo '431d73e372a6c8d38781400ce895ea4dfed9be311f2024e32689de378d78cacd  tests/services/recovery-service.test.ts' | sha256sum -c -
          paths=(
            src/services/claim-service.ts
            src/services/recovery-service.ts
            src/store/sqlite-store.ts
            tests/services/claim-service.test.ts
            tests/services/recovery-service.test.ts
          )
          expected=$'src/services/claim-service.ts\nsrc/services/recovery-service.ts\nsrc/store/sqlite-store.ts\ntests/services/claim-service.test.ts\ntests/services/recovery-service.test.ts'
          actual="$({
            git diff --name-only -- "${paths[@]}"
            git ls-files --others --exclude-standard -- "${paths[@]}"
          } | sort -u)"
          test "$actual" = "$expected"
          git diff --check
          test -z "$(git diff --name-only -- package.json package-lock.json migrations schema)"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Verify Task 12 directed matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run build --silent
          node --test \
            dist/tests/services/claim-service.test.js \
            dist/tests/services/recovery-service.test.js \
            | tee /tmp/task12-green.log
          grep -q 'tests 48' /tmp/task12-green.log
          grep -q 'pass 48' /tmp/task12-green.log
          grep -q 'fail 0' /tmp/task12-green.log

      - name: Verify complete canonical suite
        shell: bash
        run: npm run verify

      - name: Commit and publish reviewed GREEN
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .task12-publisher
          git config user.name 'developmentconexus-ops'
          git config user.email 'development.conexus@gmail.com'
          git add \
            src/services/claim-service.ts \
            src/services/recovery-service.ts \
            src/store/sqlite-store.ts \
            tests/services/claim-service.test.ts \
            tests/services/recovery-service.test.ts
          expected=$'src/services/claim-service.ts\nsrc/services/recovery-service.ts\nsrc/store/sqlite-store.ts\ntests/services/claim-service.test.ts\ntests/services/recovery-service.test.ts'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'feat: add Claims and read-only Recovery'
          git push origin HEAD:design/mis-002-m01
