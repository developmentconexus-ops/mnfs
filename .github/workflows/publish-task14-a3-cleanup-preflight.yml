name: Publish Task 14 A3 Cleanup Preflight

on:
  push:
    branches:
      - automation/task14-a3-cleanup-preflight
    paths:
      - .github/workflows/publish-task14-a3-cleanup-preflight.yml

permissions:
  contents: write

concurrency:
  group: publish-task14-a3-cleanup-preflight
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Verify exact authorized publisher lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'd64992babc0d35d473eefdc7c7ba985dc08a07a9'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/publish-task14-a3-cleanup-preflight.yml'
          test "$(git status --porcelain)" = ''

      - name: Materialize immutable read-only preflight and verifier
        shell: bash
        env:
          SCRIPT_GZ_B64: ''
          VERIFY_GZ_B64: ''
        run: |
          set -euo pipefail
          mkdir -p .github/preflight .github/workflows
          printf '%s' "$SCRIPT_GZ_B64" | base64 -d | gzip -d > .github/preflight/task14-a3-cleanup-preflight.sh
          printf '%s' "$VERIFY_GZ_B64" | base64 -d | gzip -d > .github/workflows/verify-task14-a3-cleanup-preflight.yml
          chmod 0755 .github/preflight/task14-a3-cleanup-preflight.sh
          test "$(sha256sum .github/preflight/task14-a3-cleanup-preflight.sh | cut -d' ' -f1)" = '73feb3b7c43b425456dab48dd3fd1a7872e071b71ca25659f26b4ae673fe7a6d'
          test "$(sha256sum .github/workflows/verify-task14-a3-cleanup-preflight.yml | cut -d' ' -f1)" = '724f6e43f6a6f5e727311f403266656458d44407f96982e04acf43fcc72e5a17'
          bash -n .github/preflight/task14-a3-cleanup-preflight.sh
          .github/preflight/task14-a3-cleanup-preflight.sh --print-identity

      - name: Commit instrument only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MNFS Automation'
          git config user.email 'development.conexus@gmail.com'
          git add .github/preflight/task14-a3-cleanup-preflight.sh .github/workflows/verify-task14-a3-cleanup-preflight.yml
          git commit -m 'ci: publish Task 14 A3 cleanup preflight'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/automation/task14-a3-cleanup-preflight
          echo "MNFS_TASK14_A3_CLEANUP_PREFLIGHT_PUBLISHED=$(git rev-parse HEAD)"
