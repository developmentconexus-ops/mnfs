name: Publish Task 13 RED Tracking

on:
  push:
    branches:
      - automation/task13-red-publish
    paths:
      - .github/workflows/publish-task13-red-tracking.yml

permissions:
  contents: write

concurrency:
  group: publish-task13-red-tracking
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 13 RED head
        uses: actions/checkout@v4
        with:
          ref: design/mis-002-m01
          fetch-depth: 0

      - name: Set up accepted Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Verify RED head and tracking preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '956a067336df48f54d19e634666f14bdf5a92143'
          test "$(git hash-object docs/tracking/STATUS.md)" = '5dfe97be4819245b77f3158c0609044a2e587ebe'
          test "$(git show --format= --name-only HEAD | sort)" = $'tests/cli/execution-args.test.ts\ntests/cli/execution-main.test.ts'

      - name: Record exact Task 13 RED evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path('docs/tracking/STATUS.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement, found {count}: {old!r}')
              text = text.replace(old, new)

          replace_once('version: 1.8.45', 'version: 1.8.46')
          replace_once(
              '- **Current enabler:** Issue #16 — Task 13 RED awaits explicit authority',
              '- **Current enabler:** Issue #16 — Task 13 GREEN awaits explicit authority',
          )

          old_result = '''Tasks 1–12:                        COMPLETE / ACCEPTED
Task 11 RED:                       OBSERVED / ACCEPTABLE
Task 11 GREEN:                     VERIFIED / REVIEWED
Task 12 RED:                       OBSERVED / ACCEPTABLE
Task 12 GREEN:                     VERIFIED / REVIEWED
Task 13 and later:                 NOT AUTHORIZED
Real Treehouse execution:         PROHIBITED until the final WSL2 proof gate
Pi Worker dispatch:               PROHIBITED
M01 acceptance:                    NOT AUTHORIZED
Automatic merge:                  NOT AUTHORIZED
PR:                               #17 DRAFT'''
          new_result = '''Tasks 1–12:                        COMPLETE / ACCEPTED
Task 11 RED:                       OBSERVED / ACCEPTABLE
Task 11 GREEN:                     VERIFIED / REVIEWED
Task 12 RED:                       OBSERVED / ACCEPTABLE
Task 12 GREEN:                     VERIFIED / REVIEWED
Task 13 RED:                       OBSERVED / ACCEPTABLE
Task 13 GREEN:                     NOT AUTHORIZED
Task 14:                           NOT AUTHORIZED
Real Treehouse execution:         PROHIBITED until the final WSL2 proof gate
Pi Worker dispatch:               PROHIBITED
M01 acceptance:                    NOT AUTHORIZED
Automatic merge:                  NOT AUTHORIZED
PR:                               #17 DRAFT'''
          replace_once(old_result, new_result)

          section = base64.b64decode('').decode('utf-8')
          marker = '## Frozen boundaries\n'
          if text.count(marker) != 1:
              raise SystemExit('expected one Frozen boundaries marker')
          text = text.replace(marker, section + marker)

          old_boundary = '''Tasks 1–12:                 COMPLETE / ACCEPTED
Task 11 RED:                OBSERVED / ACCEPTABLE
Task 11 GREEN:              VERIFIED / REVIEWED
Task 12 RED:                OBSERVED / ACCEPTABLE
Task 12 GREEN:              VERIFIED / REVIEWED
Task 13 and later:          NOT AUTHORIZED
Real Treehouse execution:   NOT AUTHORIZED
Pi Worker dispatch:         PROHIBITED
M01 acceptance:             NOT AUTHORIZED
PR #17 merge:               NOT AUTHORIZED'''
          new_boundary = '''Tasks 1–12:                 COMPLETE / ACCEPTED
Task 11 RED:                OBSERVED / ACCEPTABLE
Task 11 GREEN:              VERIFIED / REVIEWED
Task 12 RED:                OBSERVED / ACCEPTABLE
Task 12 GREEN:              VERIFIED / REVIEWED
Task 13 RED:                OBSERVED / ACCEPTABLE
Task 13 GREEN:              NOT AUTHORIZED
Task 14:                    NOT AUTHORIZED
Real Treehouse execution:   NOT AUTHORIZED
Pi Worker dispatch:         PROHIBITED
M01 acceptance:             NOT AUTHORIZED
PR #17 merge:               NOT AUTHORIZED'''
          replace_once(old_boundary, new_boundary)

          replace_once(
              'A separate exact Operator continuation is required for Task 13 RED, bound to accepted Task 12 implementation head `8c6fd9afa2cc7f707f96659b9efa73230579471a`. Task 13 GREEN, Task 14, real Treehouse execution, Pi dispatch, M01 acceptance and merge remain unauthorized.',
              'A separate exact Operator continuation is required for Task 13 GREEN, bound to reviewed Task 13 RED head `956a067336df48f54d19e634666f14bdf5a92143` and accepted Task 12 implementation head `8c6fd9afa2cc7f707f96659b9efa73230579471a`. Task 14, real Treehouse execution, Pi dispatch, M01 acceptance and merge remain unauthorized.',
          )

          path.write_text(text, encoding='utf-8')
          PY

          test "$(git diff --name-only)" = 'docs/tracking/STATUS.md'
          git diff --check
          grep -q '^version: 1.8.46$' docs/tracking/STATUS.md
          grep -q 'Task 13 RED:.*OBSERVED / ACCEPTABLE' docs/tracking/STATUS.md
          grep -q 'Task 13 GREEN awaits explicit authority' docs/tracking/STATUS.md
          grep -q '956a067336df48f54d19e634666f14bdf5a92143' docs/tracking/STATUS.md
          grep -q '31030653641 / 92390206386' docs/tracking/STATUS.md

      - name: Verify baseline and expected RED with tracking
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run build --silent

          set +e
          node --test \
            dist/tests/cli/execution-args.test.js \
            dist/tests/cli/execution-main.test.js \
            > /tmp/task13-tracking-directed.log 2>&1
          directed_status=$?
          node scripts/run-tests.mjs > /tmp/task13-tracking-product.log 2>&1
          product_status=$?
          set -e

          cat /tmp/task13-tracking-directed.log
          test "$directed_status" -ne 0
          grep -q 'tests 8' /tmp/task13-tracking-directed.log
          grep -q 'pass 0' /tmp/task13-tracking-directed.log
          grep -q 'fail 8' /tmp/task13-tracking-directed.log

          cat /tmp/task13-tracking-product.log
          test "$product_status" -ne 0
          grep -q 'tests 298' /tmp/task13-tracking-product.log
          grep -q 'pass 290' /tmp/task13-tracking-product.log
          grep -q 'fail 8' /tmp/task13-tracking-product.log

          node scripts/run-as02-tests.mjs > /tmp/task13-tracking-as02.log 2>&1
          grep -q 'tests 119' /tmp/task13-tracking-as02.log
          grep -q 'pass 119' /tmp/task13-tracking-as02.log
          grep -q 'fail 0' /tmp/task13-tracking-as02.log

          node scripts/run-tc01-tests.mjs > /tmp/task13-tracking-tc01.log 2>&1
          grep -q 'tests 78' /tmp/task13-tracking-tc01.log
          grep -q 'pass 78' /tmp/task13-tracking-tc01.log
          grep -q 'fail 0' /tmp/task13-tracking-tc01.log

          npm run docs:check > /tmp/task13-tracking-docs.log 2>&1
          cat /tmp/task13-tracking-docs.log
          grep -q 'Documentation validation passed (93 canonical IDs' /tmp/task13-tracking-docs.log

      - name: Commit and publish Task 13 RED tracking
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'developmentconexus-ops'
          git config user.email 'development.conexus@gmail.com'
          git add docs/tracking/STATUS.md
          test "$(git diff --cached --name-only)" = 'docs/tracking/STATUS.md'
          git diff --cached --check
          git commit -m 'docs: record Task 13 RED evidence'
          git push origin HEAD:design/mis-002-m01
