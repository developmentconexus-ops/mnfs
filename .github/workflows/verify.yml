name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind isolated review branch to candidate
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'review/')
        shell: bash
        run: |
          git fetch origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          echo "REVIEW_CANDIDATE_REF=origin/${GITHUB_BASE_REF}" >> "$GITHUB_ENV"
      - name: Admit temporary gate work on Draft PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft && !startsWith(github.head_ref, 'review/')
        shell: bash
        run: echo "TEMPORARY_GATE=1" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
