name: Conexus 3L Package A

on:
  pull_request:
    paths:
      - 'spikes/conexus-3l-a/**'
      - 'docs/conexus/phase3/3L-A-builder-substrate-cognition.md'
      - '.github/workflows/conexus-3l-a.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Qualification track to run live
        required: true
        default: a3
        type: choice
        options:
          - a3
          - a2

permissions:
  contents: read

jobs:
  mastra-persistent-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conexus_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conexus_probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/conexus_probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install exact spike lock without lifecycle scripts
        working-directory: spikes/conexus-3l-a
        run: npm ci --ignore-scripts --audit=false --fund=false
      - name: Confirm PostgreSQL exact minor
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d conexus_probe -Atc 'show server_version;'
      - name: Run A1 Mastra/Postgres qualification probes
        working-directory: spikes/conexus-3l-a
        run: node --test tests/mastra-runtime.test.mjs
      - name: Run A2 pinned-adapter contract probes without provider I/O
        working-directory: spikes/conexus-3l-a
        run: node --test tests/e2b-adapter-contract.test.mjs
      - name: Run physical-incarnation guard specification
        working-directory: spikes/conexus-3l-a
        run: node --test tests/physical-incarnation-guard.test.mjs
      - name: Run A3 non-billable contracts
        working-directory: spikes/conexus-3l-a
        run: >-
          node --test
          tests/a3-admission.test.mjs
          tests/a3-runner-contract.test.mjs
          tests/a3-live-runner.test.mjs
      - name: Syntax-check A3 live executor without provider calls
        working-directory: spikes/conexus-3l-a
        run: node --check src/a3-live-execute.mjs

  # A2 is already qualified. Replay its provider suite only when explicitly selected.
  e2b-live:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'a2'
    runs-on: ubuntu-latest
    environment: E2B_API_KEY
    timeout-minutes: 20
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Require approved E2B credential
        run: |
          if [ -z "$E2B_API_KEY" ]; then
            echo 'A2_E2B_LIVE=NOT_PROVEN_NO_APPROVED_CREDENTIAL'
            exit 1
          fi
      - name: Install exact spike lock without lifecycle scripts
        working-directory: spikes/conexus-3l-a
        run: npm ci --ignore-scripts --audit=false --fund=false
      - name: Run A2 live E2B qualification probes serially
        working-directory: spikes/conexus-3l-a
        run: >-
          node --test --test-concurrency=1
          tests/e2b-live.test.mjs
          tests/e2b-envelope-live.test.mjs
          tests/e2b-controls-live.test.mjs
          tests/e2b-db-reconcile-live.test.mjs

  a3-live:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'a3'
    runs-on: ubuntu-latest
    environment: E2B_API_KEY
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conexus_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conexus_probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/conexus_probe
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      A3_RESULT_PATH: a3-cognition-result.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Require only credentials needed by A3
        run: |
          if [ -z "$E2B_API_KEY" ]; then
            echo 'A3=NOT_PROVEN_NO_E2B_CREDENTIAL'
            exit 1
          fi
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo 'A3=NOT_PROVEN_NO_OPENROUTER_CREDENTIAL'
            exit 1
          fi
      - name: Install exact spike lock without lifecycle scripts
        working-directory: spikes/conexus-3l-a
        run: npm ci --ignore-scripts --audit=false --fund=false
      - name: Confirm PostgreSQL exact minor
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d conexus_probe -Atc 'show server_version;'
      - name: Execute the admitted four-run OM OFF x ON experiment
        working-directory: spikes/conexus-3l-a
        run: node src/a3-live-execute.mjs
      - name: Preserve A3 deciding evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conexus-3l-a3-cognition
          path: spikes/conexus-3l-a/a3-cognition-result.json
          if-no-files-found: warn
          retention-days: 14

  external-credential-admission:
    runs-on: ubuntu-latest
    environment: E2B_API_KEY
    steps:
      - name: Report only credentials needed by the current Package A path
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node - <<'NODE'
          const availability = {
            E2B_API_KEY: Boolean(process.env.E2B_API_KEY),
            OPENROUTER_API_KEY: Boolean(process.env.OPENROUTER_API_KEY),
          };
          console.log(JSON.stringify(availability, null, 2));
          if (!availability.E2B_API_KEY) console.log('A2_E2B_LIVE=NOT_PROVEN_NO_APPROVED_CREDENTIAL');
          if (!availability.OPENROUTER_API_KEY) console.log('A3_OM_COGNITION=NOT_PROVEN_NO_APPROVED_MODEL_CREDENTIAL');
          NODE
