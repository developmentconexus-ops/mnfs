name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.mnfs/**'
      - 'policies/**'
      - 'schemas/**'
      - 'spikes/arr-s0/**'
      - 'scripts/generate-*.mjs'
      - 'scripts/build-mis-002-replan.mjs'
      - 'scripts/sec-e1-policy.mjs'
      - 'scripts/validate-docs.mjs'
      - 'scripts/document-utils.mjs'
      - 'scripts/test-documentation-tooling.mjs'
      - 'scripts/test-mis-002-replan-builder.mjs'
      - 'scripts/test-approved-mis-002-allocations.mjs'
      - 'scripts/test-arr-p1-blueprint-reconciliation.mjs'
      - 'scripts/test-arr-spike-contract-binding.mjs'
      - 'scripts/test-arr-s0-contract-consistency.mjs'
      - 'scripts/run-arr-s0-tests.mjs'
      - 'README.md'
      - 'AGENTS.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.mnfs/**'
      - 'policies/**'
      - 'schemas/**'
      - 'spikes/arr-s0/**'
      - 'scripts/generate-*.mjs'
      - 'scripts/build-mis-002-replan.mjs'
      - 'scripts/sec-e1-policy.mjs'
      - 'scripts/validate-docs.mjs'
      - 'scripts/document-utils.mjs'
      - 'scripts/test-documentation-tooling.mjs'
      - 'scripts/test-mis-002-replan-builder.mjs'
      - 'scripts/test-approved-mis-002-allocations.mjs'
      - 'scripts/test-arr-p1-blueprint-reconciliation.mjs'
      - 'scripts/test-arr-spike-contract-binding.mjs'
      - 'scripts/test-arr-s0-contract-consistency.mjs'
      - 'scripts/run-arr-s0-tests.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - name: Verify component - typecheck
        run: npm run typecheck
      - name: Verify component - unit
        run: npm run test:unit
      - name: Verify component - AS-02
        run: npm run test:as02
      - name: Verify component - TC-01
        run: npm run test:tc01
      - name: Verify component - ARR-S0
        run: npm run test:arr-s0
      - name: Verify component - prepared docs
        run: npm run docs:check:prepared
