openapi: 3.1.2
info:
  title: Conexus Product API Identity and Workspace Path Items
  version: 4b-candidate
paths:
  /api/control/access-context:
    get:
      summary: GetControlPlaneAccessContext
      operationId: GetControlPlaneAccessContext
      x-conexus-4a-id: IAM-01
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Current disclosable Control Plane access context resolved from server-owned authority.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accountId, workspaces, projects]
                properties:
                  accountId: { type: string, minLength: 1 }
                  workspaces:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [workspaceId]
                      properties:
                        workspaceId: { type: string, minLength: 1 }
                  projects:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [projectId, workspaceId]
                      properties:
                        projectId: { type: string, minLength: 1 }
                        workspaceId: { type: string, minLength: 1 }
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'

  /api/control/session:
    delete:
      summary: EndSession
      operationId: EndSession
      x-conexus-4a-id: IAM-02
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '204':
          description: Current Conexus session ended.
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'

  /api/control/accounts:
    post:
      summary: ProvisionAccount
      operationId: ProvisionAccount
      x-conexus-4a-id: IAM-03
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [externalSubject]
              properties:
                externalSubject:
                  type: string
                  minLength: 1
                  description: Stable subject from the single server-pinned configured authentication issuer; caller cannot select issuer/provider authority.
      responses:
        '201':
          description: Conexus Account provisioned or the same admitted intake resolved to its already-created Account.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accountId]
                properties:
                  accountId: { type: string, minLength: 1 }
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'

  /api/control/workspaces/{workspaceId}/members:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Untrusted reference only; current containment and disclosure are resolved server-side.
        schema: { type: string, minLength: 1 }
    get:
      summary: ListWorkspaceMembers
      operationId: ListWorkspaceMembers
      x-conexus-4a-id: IAM-04
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Current disclosable Workspace members.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [accountId]
                      properties:
                        accountId: { type: string, minLength: 1 }
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'

  /api/control/workspaces/{workspaceId}/members/{accountId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Untrusted reference only; current containment and authority are resolved server-side.
        schema: { type: string, minLength: 1 }
      - name: accountId
        in: path
        required: true
        description: Untrusted reference only; current containment and authority are resolved server-side.
        schema: { type: string, minLength: 1 }
    put:
      summary: AddWorkspaceMember
      operationId: AddWorkspaceMember
      x-conexus-4a-id: IAM-05
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '204': { description: Workspace membership established. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
    delete:
      summary: RemoveWorkspaceMember
      operationId: RemoveWorkspaceMember
      x-conexus-4a-id: IAM-06
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '204': { description: Workspace membership removed. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }

