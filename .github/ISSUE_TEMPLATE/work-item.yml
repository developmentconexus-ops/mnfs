name: MNFS work item
description: A scoped, testable MNFS change
title: "[M?] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observable result must exist?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: What command or artifact proves completion?
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What is deliberately excluded?
