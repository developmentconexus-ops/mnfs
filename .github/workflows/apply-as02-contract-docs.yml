name: Apply AS-02 durable fixture contract

on:
  push:
    branches:
      - spike/as-02-local-sandbox
    paths:
      - .github/workflows/apply-as02-contract-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/as-02-local-sandbox
          fetch-depth: 0
      - name: Apply exact reviewed contract patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          fixture_path = Path('spikes/as-02/src/fixture.mjs')
          fixture = fixture_path.read_text()
          fixture = replace_once(
              fixture,
              "export async function createFixture({ baseRoot = '/tmp/mnfs-as-02', runId, runner = runProcess }) {\n"
              "  assertAs02(typeof runId === 'string' && RUN_ID_PATTERN.test(runId), 'INVALID_RUN_ID', 'Run ID must use lowercase letters, numbers and single hyphens.', { runId });\n\n"
              "  const base = await realpath(baseRoot);\n",
              "export async function createFixture({ baseRoot, runId, runner = runProcess } = {}) {\n"
              "  assertAs02(typeof runId === 'string' && RUN_ID_PATTERN.test(runId), 'INVALID_RUN_ID', 'Run ID must use lowercase letters, numbers and single hyphens.', { runId });\n"
              "  assertAs02(\n"
              "    typeof baseRoot === 'string' && isAbsolute(baseRoot) && baseRoot !== '/mnt' && !baseRoot.startsWith('/mnt/'),\n"
              "    'FIXTURE_PATH_ESCAPE',\n"
              "    'Fixture base root must be an explicit absolute Linux path outside /mnt.',\n"
              "    { baseRoot },\n"
              "  );\n\n"
              "  const base = await realpath(baseRoot);\n",
              'require explicit durable fixture root',
          )
          fixture_path.write_text(fixture)

          design_path = Path('docs/design/2026-08-02-as-02-local-pi-sandbox-wsl2.md')
          design = design_path.read_text()
          design = replace_once(design, 'version: 0.1.1', 'version: 0.1.2', 'bump design version')
          design = replace_once(
              design,
              "```text\n/tmp/mnfs-as-02/<run-id>/\n  source-repo/\n  treehouse-root/\n  leased-worktree/\n  fake-home/\n  controlled-home-sentinel/\n  outside-write-root/\n  active-policy/\n  runtime-artifacts/\n  controlled-sockets/\n```\n",
              "```text\n${MNFS_HOME:-$HOME/.local/state/mnfs}/fixtures/as-02/<run-id>/\n  source-repo/\n  treehouse/\n  fake-home/\n  outside-write-root/\n  active-policy/\n  runtime-artifacts/\n  attempt-temp/\n```\n\nThe fixture root is durable across a full `wsl --terminate` cycle because S15 must re-read the source repository, Git metadata, synthetic sentinels, policies and operation roots after Ubuntu starts again. `createFixture()` has no implicit `/tmp` fallback; the orchestrator must supply the exact Linux state root.\n\nThe controlled Unix socket is the only run resource intentionally placed under `/tmp`: `/tmp/mnfs-as02-<uid>/<run-hash>.sock`. It contains no state, is below Linux `sockaddr_un` pathname limits, is removed when each phase closes, is recreated mechanically from the run ID during `restart-resume`, and is excluded from the fixture manifest and restart checkpoint. A non-socket entry occupying that path fails closed and is never deleted.\n",
              'replace legacy fixture layout',
          )
          design = replace_once(
              design,
              "The Docker socket, when present, must not be opened. If it does not exist, the harness creates a controlled Unix socket and marks Docker-specific evidence `NOT_PRESENT` rather than claiming a direct Docker proof.\n",
              "The Docker socket, when present, must not be opened. If it does not exist, the harness creates a controlled Unix socket and marks Docker-specific evidence `NOT_PRESENT` rather than claiming a direct Docker proof. The socket pathname is a short per-user `/tmp` path derived from the run ID; unlike fixture and checkpoint state, it is deliberately ephemeral and recreated after WSL restart.\n",
              'document socket lifecycle',
          )
          design_path.write_text(design)

          plan_path = Path('docs/superpowers/plans/2026-08-02-as-02-local-pi-sandbox-wsl2.md')
          plan = plan_path.read_text()
          plan = replace_once(
              plan,
              "- `spikes/as-02/src/fixture.mjs` — creates and cleans controlled sentinels and disposable repository state.\n",
              "- `spikes/as-02/src/fixture.mjs` — creates and cleans durable controlled sentinels and disposable repository state under the Linux MNFS state root.\n"
              "- `spikes/as-02/src/controlled-socket.mjs` — derives, opens, recreates and cleans the short ephemeral Unix socket used only by S8.\n",
              'add socket lifecycle file map',
          )
          plan = replace_once(
              plan,
              "- all fixture roots are below `/tmp/mnfs-as-02/<run-id>` except the optional controlled `/mnt/c/mnfs-as-02/<run-id>` sentinel;\n",
              "- all restart-bound fixture roots are below `${MNFS_HOME:-$HOME/.local/state/mnfs}/fixtures/as-02/<run-id>`; only the controlled Unix socket is ephemeral under a short per-user `/tmp` pathname, and the optional mount sentinel remains under `/mnt/c/mnfs-as-02/<run-id>`;\n",
              'update fixture test contract',
          )
          plan_path.write_text(plan)

          readme_path = Path('spikes/as-02/README.md')
          readme = readme_path.read_text()
          readme = replace_once(
              readme,
              "- Fixture and Treehouse Lease acquisition are persisted before later work can fail, allowing explicit cleanup after interruption.\n",
              "- Fixture and Treehouse Lease acquisition are persisted before later work can fail, allowing explicit cleanup after interruption.\n"
              "- Restart-bound fixture state lives under `${MNFS_HOME:-$HOME/.local/state/mnfs}/fixtures/as-02`; it never relies on `/tmp`.\n"
              "- Only the controlled S8 Unix socket uses a short per-user `/tmp` pathname. It is stateless, recreated after restart and fails closed if occupied by a non-socket entry.\n"
              "- Mount and socket cleanup paths are derived from the run ID rather than trusted from nested state.\n",
              'document operational roots',
          )
          readme_path.write_text(readme)

          provenance_path = Path('spikes/as-02/PROVENANCE.md')
          provenance = provenance_path.read_text()
          provenance = replace_once(
              provenance,
              "## Upgrade and removal rule\n",
              "## Canonical WSL2 failure-driven hardening\n\nThe real Ubuntu WSL2 execution identified and corrected four lifecycle assumptions before acceptance:\n\n- a disposable source repository under `/tmp` does not survive `wsl --terminate`, which also invalidates Treehouse linked-worktree Git pointers; restart-bound fixture state is therefore under the durable MNFS Linux state root;\n- Pi extension discovery and interactive OAuth state cannot be assumed when `--no-extensions` is active; the exact OAuth adapter is loaded explicitly and version-bound;\n- custom broker paths must be propagated through the reduced Worker environment, and the Pi pilot must prove a real nonce-bound `read` call rather than accept copied model text;\n- Unix-domain socket pathnames have a platform length limit, so S8 uses a short stateless per-user `/tmp` pathname derived from the run ID while all restart evidence remains durable.\n\nCleanup preserves completed substeps across retries. Run-scoped socket and mount cleanup paths are derived mechanically from the run ID, and a regular file or symlink occupying the controlled socket pathname is never removed automatically.\n\n## Upgrade and removal rule\n",
              'record canonical failure-driven hardening',
          )
          provenance_path.write_text(provenance)

          Path('.github/workflows/apply-as02-contract-docs.yml').unlink()
          PY
      - name: Commit exact contract patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "docs(as02): bind durable and ephemeral resource lifecycles"
          git push origin HEAD:spike/as-02-local-sandbox
