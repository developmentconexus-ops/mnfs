name: Recover Task 14 A3 Cleanup Preflight Publisher

on:
  push:
    branches:
      - automation/task14-a3-cleanup-preflight
    paths:
      - .github/workflows/recover-task14-a3-cleanup-preflight-publisher.yml

permissions:
  contents: write

concurrency:
  group: recover-task14-a3-cleanup-preflight-publisher
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Verify exact recovery lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '77aa39a5b743e0bcf398c79f2de93dfd55a66619'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/recover-task14-a3-cleanup-preflight-publisher.yml'
          test "$(git status --porcelain)" = ''

      - name: Recover and validate immutable bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import re

          source = Path('.github/workflows/publish-task14-a3-cleanup-preflight.yml').read_text(encoding='utf-8')

          def recover(name: str, destination: str, expected_sha256: str) -> None:
              match = re.search(rf"^\s+{name}: '([^']*)'$", source, flags=re.MULTILINE)
              if match is None:
                  raise SystemExit(f'missing embedded payload {name}')
              raw = match.group(1)
              clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              print(f'{name}_RAW_LENGTH={len(raw)}')
              print(f'{name}_CLEAN_LENGTH={len(clean)}')
              decoded = gzip.decompress(base64.b64decode(clean, validate=False))
              observed = hashlib.sha256(decoded).hexdigest()
              if observed != expected_sha256:
                  raise SystemExit(f'{name} hash mismatch: {observed}')
              path = Path(destination)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(decoded)

          recover(
              'SCRIPT_GZ_B64',
              '.github/preflight/task14-a3-cleanup-preflight.sh',
              '73feb3b7c43b425456dab48dd3fd1a7872e071b71ca25659f26b4ae673fe7a6d',
          )
          recover(
              'VERIFY_GZ_B64',
              '.github/workflows/verify-task14-a3-cleanup-preflight.yml',
              '724f6e43f6a6f5e727311f403266656458d44407f96982e04acf43fcc72e5a17',
          )
          PY
          chmod 0755 .github/preflight/task14-a3-cleanup-preflight.sh
          bash -n .github/preflight/task14-a3-cleanup-preflight.sh
          .github/preflight/task14-a3-cleanup-preflight.sh --print-identity

      - name: Publish recovered instrument and remove recovery transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MNFS Automation'
          git config user.email 'development.conexus@gmail.com'
          git rm .github/workflows/recover-task14-a3-cleanup-preflight-publisher.yml
          git add .github/preflight/task14-a3-cleanup-preflight.sh .github/workflows/verify-task14-a3-cleanup-preflight.yml
          git commit -m 'ci: publish Task 14 A3 cleanup preflight'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/automation/task14-a3-cleanup-preflight
          echo "MNFS_TASK14_A3_CLEANUP_PREFLIGHT_PUBLISHED=$(git rev-parse HEAD)"
