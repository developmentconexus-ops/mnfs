name: ARR P1 B1 RED Transformer

on:
  push:
    branches:
      - reconcile/arr-p1-b1-red-transform

permissions:
  contents: write

jobs:
  red:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/arr-p1-b1-red-transform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Apply reviewed RED test transform
        run: node scripts/arr-p1-b1-red-transform.mjs
      - name: Prove RED
        run: |
          set +e
          npm run docs:test > /tmp/b1-red.log 2>&1
          status=$?
          set -e
          cat /tmp/b1-red.log
          if [ "$status" -eq 0 ]; then
            echo 'B1 RED unexpectedly passed.' >&2
            exit 1
          fi
          grep -q 'Architecture Spike Evidence' /tmp/b1-red.log
          echo 'B1 RED observed as expected.'
      - name: Remove transport-only machinery
        run: rm .github/workflows/arr-p1-b1-red-transform.yml scripts/arr-p1-b1-red-transform.mjs
      - name: Commit RED tests only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'test: define shared Architecture Spike Evidence rejection cases'
          git push origin HEAD:reconcile/arr-p1-b1-red-transform
