name: ARR P1 F02 GREEN Transformer

on:
  push:
    branches:
      - reconcile/arr-p1-f02-green-transform

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/arr-p1-f02-green-transform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Apply P1-F02 constitutional reconciliation
        run: node scripts/arr-p1-f02-green-transform.mjs
      - name: Regenerate canonical projections
        run: npm run docs:generate
      - name: Prove strengthened reconciliation contract
        run: npm run docs:test
      - name: Validate complete documentation
        run: npm run docs:check
      - name: Verify complete repository
        run: npm run verify
      - name: Remove transport-only machinery
        run: rm scripts/arr-p1-f02-green-transform.mjs .github/workflows/arr-p1-f02-green-transform.yml
      - name: Commit final verified F02 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'docs: reconcile current blueprint body provider-neutrally'
          git push origin HEAD:reconcile/arr-p1-f02-green-transform
