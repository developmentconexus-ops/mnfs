name: Task 13 Typecheck Diagnostic

on:
  push:
    branches:
      - automation/task13-green-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/task13-green-diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Capture exact TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          set -e
          cat /tmp/typecheck.log
          exit "$status"
