name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.mnfs/**'
      - 'schemas/**'
      - 'scripts/generate-*.mjs'
      - 'scripts/validate-docs.mjs'
      - 'README.md'
      - 'AGENTS.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.mnfs/**'
      - 'schemas/**'
      - 'scripts/generate-*.mjs'
      - 'scripts/validate-docs.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - run: npm run docs:check
