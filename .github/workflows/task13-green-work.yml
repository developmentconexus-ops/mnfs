name: Task 13 GREEN Work

on:
  push:
    branches:
      - automation/task13-green-work

permissions:
  contents: read

concurrency:
  group: task13-green-work
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: automation/task13-green-work
          fetch-depth: 0

      - name: Set up accepted Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Directed Task 13 tests
        run: |
          npm run build --silent
          node --test \
            dist/tests/cli/execution-args.test.js \
            dist/tests/cli/execution-main.test.js \
            dist/tests/cli/execution-red-review.test.js

      - name: Full product suite
        run: node scripts/run-tests.mjs
