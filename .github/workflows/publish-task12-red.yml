name: Diagnose authorized Task 12 RED payload

on:
  push:
    branches:
      - automation/task12-red-publish
    paths:
      - .github/workflows/publish-task12-red.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publisher payload
        uses: actions/checkout@v4
        with:
          ref: automation/task12-red-publish
          fetch-depth: 1

      - name: Measure exact payload fragments
        shell: bash
        run: |
          set -euo pipefail
          wc -c \
            .github/task12-red-payload/part-00.b64 \
            .github/task12-red-payload/part-01.b64
          sha256sum \
            .github/task12-red-payload/part-00.b64 \
            .github/task12-red-payload/part-01.b64
          cat \
            .github/task12-red-payload/part-00.b64 \
            .github/task12-red-payload/part-01.b64 \
            > /tmp/task12-red-tests.tar.gz.b64
          wc -c /tmp/task12-red-tests.tar.gz.b64
          sha256sum /tmp/task12-red-tests.tar.gz.b64
          set +e
          base64 -d /tmp/task12-red-tests.tar.gz.b64 > /tmp/task12-red-tests.tar.gz
          status=$?
          set -e
          echo "decode_status=$status"
          if [ "$status" -eq 0 ]; then
            sha256sum /tmp/task12-red-tests.tar.gz
            tar -tzf /tmp/task12-red-tests.tar.gz
          fi
