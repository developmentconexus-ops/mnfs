name: Upload Concurrent Task 14 Workspace

on:
  push:
    branches:
      - automation/task14-deterministic-export
    paths:
      - .github/workflows/upload-concurrent-task14-workspace.yml

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a6822409e2b860de534c5fc68e9cc1ee1afb8c4d
          fetch-depth: 0

      - name: Verify exact concurrent candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a6822409e2b860de534c5fc68e9cc1ee1afb8c4d'
          test "$(git rev-parse HEAD^)" = '8426d1cea089bb3bc27aa6a1544ba289a1b5965e'
          expected=$'tests/integration/m01-composition.test.ts\ntests/integration/m01-fresh-process.test.ts'
          actual="$(git diff-tree --no-commit-id --name-only -r HEAD | sort)"
          test "$actual" = "$expected"

      - name: Build deterministic archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./dist' \
            -czf /tmp/mnfs-task14-concurrent-a682240.tar.gz .
          sha256sum /tmp/mnfs-task14-concurrent-a682240.tar.gz > /tmp/mnfs-task14-concurrent-a682240.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mnfs-task14-concurrent-a682240
          path: |
            /tmp/mnfs-task14-concurrent-a682240.tar.gz
            /tmp/mnfs-task14-concurrent-a682240.sha256
          if-no-files-found: error
          retention-days: 1
