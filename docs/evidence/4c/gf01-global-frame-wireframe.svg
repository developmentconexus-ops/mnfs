<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">GF-01 Conexus Control Plane global frame structural wireframe</title>
  <desc id="desc">Candidate H1 single adaptive navigation rail shown in Workspace, Project, and narrow responsive contexts. Structural grayscale evidence only; not locked.</desc>
  <rect width="1500" height="980" fill="#ffffff"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202020; }
    .h1 { font-size: 25px; font-weight: 700; }
    .h2 { font-size: 17px; font-weight: 700; }
    .body { font-size: 14px; }
    .small { font-size: 12px; fill: #555; }
    .box { fill: #fafafa; stroke: #777; stroke-width: 1.5; }
    .frame { fill: #fff; stroke: #333; stroke-width: 2; }
    .active { fill: #e5e5e5; stroke: #666; stroke-width: 1; }
    .soft { fill: #f3f3f3; stroke: #aaa; stroke-width: 1; }
    .line { stroke: #999; stroke-width: 1; }
    .dash { fill: none; stroke: #888; stroke-width: 1; stroke-dasharray: 5 5; }
  </style>

  <text x="40" y="42" class="h1">GF-01 — Global frame candidate H1 · Single adaptive rail</text>
  <text x="40" y="68" class="body">CANDIDATE · NOT LOCKED · Workspace.name / Project.name are server-owned presentation identity</text>

  <!-- Workspace desktop -->
  <text x="40" y="112" class="h2">A. Desktop — Workspace context</text>
  <rect x="40" y="130" width="690" height="365" rx="8" class="frame"/>
  <rect x="40" y="130" width="690" height="58" rx="8" class="soft"/>
  <line x1="40" y1="188" x2="730" y2="188" class="line"/>
  <text x="60" y="164" class="h2">Conexus</text>
  <rect x="155" y="143" width="205" height="32" rx="5" class="box"/>
  <text x="170" y="164" class="body">Workspace: Metal Nobre ▾</text>
  <rect x="607" y="143" width="103" height="32" rx="16" class="box"/>
  <text x="624" y="164" class="body">Account ▾</text>

  <rect x="40" y="188" width="192" height="307" class="soft"/>
  <text x="58" y="217" class="small">WORK</text>
  <rect x="51" y="229" width="170" height="34" rx="4" class="active"/>
  <text x="66" y="251" class="body">Projects</text>
  <text x="66" y="286" class="body">Agents</text>
  <text x="58" y="322" class="small">SHARED CONTEXT</text>
  <text x="66" y="350" class="body">Brain</text>
  <text x="66" y="380" class="body">Connections</text>
  <text x="58" y="418" class="small">ADMIN / INVESTIGATE</text>
  <text x="66" y="446" class="body">People &amp; access</text>
  <text x="66" y="476" class="body">Audit</text>

  <text x="260" y="220" class="h2">Projects</text>
  <text x="260" y="247" class="small">Primary Workspace destination</text>
  <rect x="260" y="270" width="432" height="78" rx="6" class="box"/>
  <text x="280" y="300" class="body">Budget Analyzer</text>
  <text x="280" y="326" class="small">Project identity + current disclosure</text>
  <rect x="260" y="362" width="432" height="78" rx="6" class="box"/>
  <text x="280" y="392" class="body">Marketplace Central</text>
  <text x="280" y="418" class="small">Project identity + current disclosure</text>
  <rect x="573" y="207" width="119" height="34" rx="5" class="box"/>
  <text x="594" y="229" class="body">New Project</text>

  <!-- Project desktop -->
  <text x="770" y="112" class="h2">B. Desktop — Project context</text>
  <rect x="770" y="130" width="690" height="365" rx="8" class="frame"/>
  <rect x="770" y="130" width="690" height="58" rx="8" class="soft"/>
  <line x1="770" y1="188" x2="1460" y2="188" class="line"/>
  <text x="790" y="164" class="h2">Conexus</text>
  <rect x="885" y="143" width="188" height="32" rx="5" class="box"/>
  <text x="900" y="164" class="body">Metal Nobre ▾</text>
  <text x="1087" y="164" class="body">/</text>
  <rect x="1104" y="143" width="214" height="32" rx="5" class="box"/>
  <text x="1119" y="164" class="body">Budget Analyzer ▾</text>
  <rect x="1335" y="143" width="105" height="32" rx="16" class="box"/>
  <text x="1353" y="164" class="body">Account ▾</text>

  <rect x="770" y="188" width="192" height="307" class="soft"/>
  <text x="788" y="216" class="body">← Projects</text>
  <line x1="784" y1="229" x2="948" y2="229" class="line"/>
  <rect x="781" y="240" width="170" height="34" rx="4" class="active"/>
  <text x="796" y="262" class="body">Build</text>
  <text x="788" y="299" class="small">PRODUCT</text>
  <text x="796" y="325" class="body">Data</text>
  <text x="796" y="351" class="body">Capabilities</text>
  <text x="796" y="377" class="body">Integrations</text>
  <text x="796" y="403" class="body">Agents</text>
  <text x="796" y="429" class="body">Brain</text>
  <text x="788" y="460" class="small">OPERATE / INSPECT</text>
  <text x="796" y="485" class="body">Releases · Activity</text>

  <text x="990" y="220" class="h2">Build</text>
  <text x="990" y="247" class="small">Primary/default Project destination · Preview-dominant later block</text>
  <rect x="990" y="270" width="440" height="178" rx="6" class="dash"/>
  <text x="1148" y="350" class="h2">Current surface</text>
  <text x="1070" y="378" class="small">GF-01 fixes frame only — Build composition is not decided here</text>

  <!-- transition annotation -->
  <path d="M730 315 C748 315 752 315 770 315" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
  </defs>
  <text x="713" y="300" class="small">enter Project</text>

  <!-- Narrow mobile -->
  <text x="40" y="545" class="h2">C. Narrow / mobile — same semantic navigation, one drawer</text>
  <rect x="40" y="565" width="390" height="360" rx="16" class="frame"/>
  <rect x="40" y="565" width="390" height="58" rx="16" class="soft"/>
  <text x="60" y="600" class="h2">☰</text>
  <text x="96" y="600" class="body">Budget Analyzer</text>
  <text x="338" y="600" class="body">Account</text>
  <rect x="40" y="623" width="252" height="302" class="soft"/>
  <text x="58" y="653" class="small">WORKSPACE</text>
  <text x="58" y="679" class="body">Metal Nobre ▾</text>
  <text x="58" y="715" class="small">PROJECT</text>
  <text x="58" y="741" class="body">Budget Analyzer</text>
  <line x1="55" y1="757" x2="275" y2="757" class="line"/>
  <text x="58" y="783" class="body">← Projects</text>
  <rect x="52" y="798" width="228" height="31" rx="4" class="active"/>
  <text x="67" y="819" class="body">Build</text>
  <text x="67" y="850" class="body">Data · Capabilities</text>
  <text x="67" y="878" class="body">Integrations · Agents · Brain</text>
  <text x="67" y="906" class="body">Releases · Activity · Settings</text>
  <rect x="307" y="655" width="105" height="220" rx="6" class="dash"/>
  <text x="323" y="748" class="small">content</text>
  <text x="319" y="768" class="small">behind</text>
  <text x="316" y="788" class="small">drawer</text>

  <!-- rationale -->
  <rect x="475" y="565" width="985" height="360" rx="8" class="box"/>
  <text x="500" y="600" class="h2">Structural obligations shown</text>
  <text x="500" y="636" class="body">1. Human-readable Workspace + Project context is persistent and server-derived.</text>
  <text x="500" y="668" class="body">2. Only one primary navigation rail/landmark is active for the current scope.</text>
  <text x="500" y="700" class="body">3. Workspace → Project is an explicit scope transition; “← Projects” preserves recovery.</text>
  <text x="500" y="732" class="body">4. Project destinations are task/resource labels, not backend packages.</text>
  <text x="500" y="764" class="body">5. Narrow layout reuses the same IA in one drawer; no second mobile Product model.</text>
  <text x="500" y="796" class="body">6. Account/session stays globally reachable; visibility never substitutes for authorization.</text>
  <text x="500" y="828" class="body">7. Current content receives remaining width; Build/Preview is not squeezed by a second rail.</text>
  <text x="500" y="875" class="small">Not decided here: final spacing, icons, typography, brand, component APIs, exact URL paths, router implementation.</text>
  <text x="500" y="902" class="small">Operator adjudication required: LOCKED / REVISE / REJECTED.</text>

  <text x="40" y="960" class="small">4C GF-01 structural Evidence · candidate H1 · generated for operator visual review · Product implementation remains blocked</text>
</svg>
