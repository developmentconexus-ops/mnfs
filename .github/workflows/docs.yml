name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.mnfs/**'
      - 'policies/**'
      - 'schemas/**'
      - 'scripts/generate-*.mjs'
      - 'scripts/sec-e1-policy.mjs'
      - 'scripts/validate-docs.mjs'
      - 'scripts/document-utils.mjs'
      - 'scripts/test-documentation-tooling.mjs'
      - 'README.md'
      - 'AGENTS.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.mnfs/**'
      - 'policies/**'
      - 'schemas/**'
      - 'scripts/generate-*.mjs'
      - 'scripts/sec-e1-policy.mjs'
      - 'scripts/validate-docs.mjs'
      - 'scripts/document-utils.mjs'
      - 'scripts/test-documentation-tooling.mjs'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - run: npm run verify

  reconcile-as02:
    if: github.event_name == 'pull_request' && github.head_ref == 'plan/mis-002-replan' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - name: Reconcile AS-02 evidence and Receipt scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence_id = 'ACCEPTANCE-AS-02-LOCAL-PI-SANDBOX-WSL2'
          trace_path = Path('docs/capabilities/CAP-EXECUTION/TRACEABILITY.json')
          trace = json.loads(trace_path.read_text())
          target_ids = {
              'CAP-EXEC-REQ-010',
              'CAP-EXEC-REQ-011',
              'CAP-EXEC-REQ-012',
              'CAP-EXEC-REQ-013',
          }
          for requirement in trace['requirements']:
              if requirement['id'] in target_ids:
                  requirement['state'] = 'DESIGNED'
                  requirement['blockers'] = []
                  requirement['evidencedBy'] = [evidence_id]
          trace['blockingItems'] = [
              item for item in trace.get('blockingItems', [])
              if item.get('id') != 'BLOCK-AS-02'
          ]
          trace['readiness']['R4']['reason'] = 'Approved MIS-002 schema v2 Replan unavailable'
          trace['nextSequence'] = [
              'review and accept CAP-EXECUTION',
              'run MIS-002 schema v2 Replan through Lavish',
              'approve exact new hash',
              'replace proposed allocations with approved criterion identities',
              'rerun R0-R4',
              'record explicit Operator M2 unblock decision',
          ]
          trace_path.write_text(json.dumps(trace, indent=2, ensure_ascii=False) + '\n')

          spec_path = Path('docs/capabilities/CAP-EXECUTION/SPEC.md')
          spec = spec_path.read_text()
          old = 'AS-02 must validate the real Pi + WSL2 boundary before M2 can close.'
          new = (
              'AS-02 accepted the candidate real Pi + WSL2 boundary. Run '
              '`as02-20260803t144645276z-7048d3` completed with verdict `ACCEPT`, '
              'effective policy hash '
              '`sha256:886eb0f1fb5c2087d0b5bf16a51f399dc1ffb9a75aab16d4900a9ffe6ab57797`, '
              'WSL restart status `PASS` and an empty drift set (`no drift`). '
              'This evidence proves the candidate boundary; M2 must still bind and exercise '
              'the accepted `SEC-E1` definition in the actual execution flow.'
          )
          if old not in spec:
              raise SystemExit('Expected AS-02 prerequisite sentence not found in SPEC.md')
          spec = spec.replace(old, new, 1)
          history_marker = '- 2026-08-02: this Capability Spec proposed for the Architecture Baseline.\n'
          history_line = (
              '- 2026-08-03: AS-02 run `as02-20260803t144645276z-7048d3` accepted '
              'the local Pi E1 candidate boundary; restart `PASS`, no drift, cleanup complete.\n'
          )
          if history_line not in spec:
              if history_marker not in spec:
                  raise SystemExit('Implementation history marker not found in SPEC.md')
              spec = spec.replace(history_marker, history_marker + history_line, 1)
          spec = spec.replace(
              '- Next: schema/readiness work, AS-02, Replan and exact-hash approval.',
              '- Next: explicit Capability review, MIS-002 schema-v2 Replan and exact-hash approval.',
              1,
          )
          spec_path.write_text(spec)

          domain_path = Path('docs/product/blueprint/02-domain-model.md')
          domain = domain_path.read_text()
          receipt_definition = (
              '## 2.17 Receipt\n\n'
              'Receipt é um registro imutável de verificação executada por autoridade controlada pelo MNFS.\n\n'
              'É ligado ao critério, Claim, tree hash, ambiente e comando executado.\n'
          )
          receipt_clarification = (
              receipt_definition + '\n'
              'M2 implementa apenas um Minimal Deterministic Receipt delimitado para o Golden Proof fixo: '
              'uma execução fria, runner-owned e vinculada ao contrato e result tree. '
              'Runners generalizados, Integration Receipts, QA adaptativa e Evidence Bundles permanecem '
              'capabilities de M5 e milestones posteriores.\n'
          )
          if 'M2 implementa apenas um Minimal Deterministic Receipt delimitado' not in domain:
              if receipt_definition not in domain:
                  raise SystemExit('Receipt definition marker not found in domain model')
              domain = domain.replace(receipt_definition, receipt_clarification, 1)
          old_row = '| Receipt | M5 |'
          new_row = '| Receipt | M2 — bounded Minimal Deterministic Receipt; M5+ — generalized Receipt/Evidence capability |'
          if old_row in domain:
              domain = domain.replace(old_row, new_row, 1)
          elif new_row not in domain:
              raise SystemExit('Receipt implementation-status row not found')
          domain_path.write_text(domain)

          status_path = Path('docs/tracking/STATUS.md')
          status = status_path.read_text()
          status = status.replace('version: 1.1.0', 'version: 1.2.0', 1)
          status = status.replace('tracking_issue: 7', 'tracking_issue: 9', 1)
          status = status.replace(
              '- **Current enabler:** Issue #7 — Mission Plan Contract schema v2',
              '- **Current enabler:** Issue #9 — MIS-002 schema-v2 Replan and M2 readiness reconciliation',
              1,
          )
          status = status.replace(
              '- **Implementation PR:** #12 — `feat/plan-schema-v2`',
              '- **Implementation PR:** #14 — `plan/mis-002-replan` (draft)',
              1,
          )
          status = status.replace('- [ ] PR #12 reviewed and merged.', '- [x] PR #12 reviewed and merged.', 1)
          status = status.replace('- [ ] AS-02 executed on canonical WSL2.', '- [x] AS-02 accepted and cleaned on canonical WSL2.', 1)
          status = status.replace(
              'R4 remains blocked by AS-02 and the missing approved `MIS-002` schema v2 Replan.',
              'R4 remains blocked only by the missing approved `MIS-002` schema v2 Replan.',
              1,
          )
          status = status.replace(
              '1. AS-02 has not run in the real canonical WSL2 environment.\n'
              '2. `MIS-002` revision 3 is immutable historical evidence; Issue #9 must create and approve a later schema v2 revision.\n'
              '3. MCRM R0–R4 must be recalculated after AS-02 and exact-hash Replan approval.\n'
              '4. The Operator has not explicitly unblocked M2.',
              '1. `MIS-002` revision 3 is immutable historical evidence; Issue #9 must create and approve a later schema-v2 revision.\n'
              '2. MCRM R0–R4 must be recalculated after exact-hash Replan approval.\n'
              '3. The Operator has not explicitly unblocked M2.',
              1,
          )
          status = status.replace(
              '1. Complete review and integration of PR #12 without modifying `MIS-002` revision 3.\n'
              '2. Execute Issue #8 — AS-02 on canonical WSL2.\n'
              '3. Execute Issue #9 — reconcile and Replan `MIS-002` as schema v2.\n'
              '4. Review the rendered contract in Lavish and approve the exact new hash.\n'
              '5. Mechanically rerun R0–R4.\n'
              '6. Begin M2 only after explicit Operator unblock.',
              '1. Review and explicitly accept `CAP-EXECUTION` version 0.1.0.\n'
              '2. Execute Issue #9 — create the `MIS-002` schema-v2 Replan.\n'
              '3. Review the rendered contract in Lavish and approve the exact new hash.\n'
              '4. Replace proposed allocations with approved criterion identities.\n'
              '5. Mechanically rerun R0–R4.\n'
              '6. Begin M2 only after explicit Operator unblock.',
              1,
          )
          status_path.write_text(status)

          worklog_path = Path('docs/tracking/WORKLOG.md')
          worklog = worklog_path.read_text()
          heading = '## 2026-08-03\n\n### Issue #9 — M2 readiness reconciliation\n'
          if heading not in worklog:
              worklog += (
                  '\n## 2026-08-03\n\n'
                  '### Issue #9 — M2 readiness reconciliation\n\n'
                  '- Integrated accepted AS-02 evidence into CAP-EXECUTION without claiming M2 implementation verification.\n'
                  '- Removed the obsolete AS-02 blocker; the approved schema-v2 MIS-002 Replan remains the contract blocker.\n'
                  '- Preserved CAP-EXECUTION as `proposed`; explicit R3 Operator review is still required.\n'
                  '- Clarified M2 Minimal Deterministic Receipt versus generalized Receipt/Evidence capability in M5+.\n'
                  '- Kept M2 blocked pending Capability acceptance, exact-hash Replan approval, R0–R4 recalculation and explicit Operator unblock.\n'
              )
          worklog_path.write_text(worklog)
          PY
      - run: npm run docs:generate
      - run: npm run verify
      - name: Commit reconciled documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs scripts/test-documentation-tooling.mjs
          git commit -m "docs: reconcile AS-02 capability evidence"
          git push origin HEAD:plan/mis-002-replan
