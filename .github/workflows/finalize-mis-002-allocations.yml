name: Finalize MIS-002 Allocations

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-mis-002-allocations.yml'
      - 'docs/capabilities/CAP-EXECUTION/**'
      - '.mnfs/missions/MIS-002/plan.json'
      - 'scripts/test-approved-mis-002-allocations.mjs'
      - 'package.json'

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'plan/mis-002-replan' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - name: Finalize approved allocations and evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          approved_hash = 'sha256:d82252504044cab40e00013dc30534654382887b7819d60a916d2a9a56db4cc3'
          policy_hash = 'sha256:f3dfca19f39bdd733f414831834a380b997e4938c10669c89a034cd9ad9c2471'
          historical_hash = 'sha256:f95ffded37af764e5f76775ec6bbdda69d5638246609451ce37bf524908cf8c1'
          historical_blob = '6b79117fe66cd5c9c8142099828812f470ce20de'
          acceptance_id = 'ACCEPTANCE-MIS-002-REPLAN'

          contract_path = Path('.mnfs/missions/MIS-002/plan.json')
          contract = json.loads(contract_path.read_text())
          assert contract['missionId'] == 'MIS-002'
          assert contract['revision'] == 5
          assert contract['contentHash'] == approved_hash
          assert contract['content']['schemaVersion'] == 2
          assert contract.get('approvedAt')

          criterion_ids = {
              criterion['qualifiedId']
              for criterion in contract['content']['acceptanceCriteria']
          }
          for milestone in contract['content']['milestones']:
              criterion_ids.update(
                  criterion['qualifiedId']
                  for criterion in milestone['acceptanceCriteria']
              )
              for feature in milestone['features']:
                  criterion_ids.update(
                      criterion['qualifiedId']
                      for criterion in feature['acceptanceCriteria']
                  )

          trace_path = Path('docs/capabilities/CAP-EXECUTION/TRACEABILITY.json')
          trace = json.loads(trace_path.read_text())
          assert len(trace['requirements']) == 28

          allocation_rows = []
          for requirement in trace['requirements']:
              proposed = requirement.get('proposedAllocation', [])
              assert proposed, f"{requirement['id']} has no proposed allocation"
              assert all(value.startswith('proposed:') for value in proposed)
              approved = [value.removeprefix('proposed:') for value in proposed]
              assert all(value in criterion_ids for value in approved), (
                  requirement['id'], approved
              )
              requirement['allocatedTo'] = approved
              requirement['proposedAllocation'] = []
              allocation_rows.append((requirement['id'], requirement['level'], ', '.join(approved)))

              if requirement['id'] in {'CAP-EXEC-REQ-026', 'CAP-EXEC-REQ-027'}:
                  requirement['state'] = 'DESIGNED'
                  requirement['blockers'] = []
                  evidence = requirement.setdefault('evidencedBy', [])
                  if acceptance_id not in evidence:
                      evidence.append(acceptance_id)

          trace['baseline']['missionContract'] = {
              'missionId': 'MIS-002',
              'currentRevision': 5,
              'status': 'APPROVED_SCHEMA_V2',
          }
          trace['readiness']['R4'] = {
              'result': 'PASS',
              'reason': 'Approved MIS-002 revision 5 schema-v2 contract allocates all 28 requirements to exact criteria',
          }
          trace['blockingItems'] = []
          trace['nextSequence'] = [
              'review mechanical R0-R4 evidence',
              'obtain explicit Operator M2 unblock',
              'write M01 microdesign only after unblock',
          ]
          trace_path.write_text(json.dumps(trace, indent=2, ensure_ascii=False) + '\n')

          table = '\n'.join(
              f"| `{req_id}` | {level} | `{target}` |"
              for req_id, level, target in allocation_rows
          )
          acceptance = f'''---
id: {acceptance_id}
title: MIS-002 schema-v2 Replan Acceptance
document_type: acceptance_report
form: explanation
authority: evidence
status: accepted
version: 1.0.0
owners:
  - developmentconexus-ops
related:
  - CAP-EXECUTION
  - CAP-EXECUTION-COVERAGE
  - ACCEPTANCE-CAP-EXECUTION-R3
  - ACCEPTANCE-AS-02-LOCAL-PI-SANDBOX-WSL2
  - DESIGN-MIS-002-REPLAN
tracking_issue: 9
last_reviewed: 2026-08-03
---

# MIS-002 schema-v2 Replan Acceptance

## Decision

The Operator reviewed the complete schema-v2 Replan in Lavish and authorized exact-hash approval with:

```text
MNFS_APPROVE_PLAN mission=MIS-002 hash={approved_hash}
```

The planning service approved and materialized:

```text
Mission:       MIS-002
Revision:      5
Schema:        2
Status:        APPROVED
Content hash:  {approved_hash}
Approved at:   {contract['approvedAt']}
```

This accepts the Mission contract and its exact criterion allocation. It does not implement the Worker, enter R5 microdesign, unblock M2 or authorize dispatch.

## Preservation and bindings

```text
Historical revision 3 blob: {historical_blob}
Historical content hash:    {historical_hash}
SEC-E1 definition hash:     {policy_hash}
CAP-EXECUTION version:      0.1.0
```

Revision 3 remains immutable historical evidence. Revision 5 contains two Milestones, 3+5 Features, 28 requirement references, independent Mission/Milestone/Feature criteria and the explicit Golden Proof composition criteria.

## Approved requirement allocations

| Requirement | Level | Approved criterion |
|---|---|---|
{table}

All 28 proposed targets were converted mechanically by removing only the `proposed:` prefix and proving that each resulting qualified criterion exists in the approved revision 5 contract.

## Mechanical readiness

```text
R0 Baseline              PASS
R1 Applicability         PASS
R2 Requirements          PASS
R3 Capability Readiness  PASS
R4 Contract Readiness    PASS
R5 Milestone Microdesign NOT_STARTED
```

R4 PASS means the architecture baseline, applicability, requirements, accepted Capability, exact approved schema-v2 contract and criterion allocations are coherent. It does not mean implementation has started.

## Remaining authority gate

M2 remains blocked pending a separate exact Operator token tied to `{approved_hash}` and R0-R4. Until that decision:

```text
M2 implementation: NOT_STARTED
M01 microdesign:    PROHIBITED
Worker dispatch:    PROHIBITED
PR merge:           not implied
```
'''
          Path('docs/acceptance/2026-08-03-mis-002-replan.md').write_text(acceptance)

          status = f'''---
id: DOC-PROJECT-STATUS
title: MNFS Project Status
document_type: project_status
form: reference
authority: tracking
status: current
version: 1.4.0
owners:
  - developmentconexus-ops
related:
  - DOC-DOCUMENTATION-MAP
  - DOC-CAPABILITY-ROADMAP
  - EVID-PLAN-CONTRACT-SCHEMA-V2
  - ACCEPTANCE-CAP-EXECUTION-R3
  - {acceptance_id}
tracking_issue: 9
---

# Project status

- **Program:** Pi-first MNFS
- **Canonical environment:** Ubuntu on WSL2; Windows remains the browser, terminal and desktop host
- **Completed Product Milestones:** M0 — Foundation Walking Skeleton; M1 — Visual Mission Planning
- **Architecture Baseline:** accepted and merged through PR #11 at `f28cf2b58b7f1682450399c6edb50c983fff0cc2`
- **Current enabler:** Issue #9 — M2 readiness decision
- **Implementation PR:** #14 — `plan/mis-002-replan` (draft)
- **M2 state:** blocked pending explicit Operator unblock; Worker implementation has not started
- **Approved M2 contract:** MIS-002 revision 5, schema v2, `{approved_hash}`
- **Historical contract:** revision 3 preserved at blob `{historical_blob}`

## Architecture and contract progress

- [x] Product Blueprint, Roadmap, Governance and Capability Realization Method approved.
- [x] CAP-EXECUTION applicability and 28 requirements reconciled.
- [x] Plan Contract schema v2 implemented and verified.
- [x] AS-02 accepted on canonical Ubuntu WSL2.
- [x] CAP-EXECUTION version 0.1.0 accepted; R3 PASS.
- [x] MIS-002 revision 5 reviewed in Lavish and exact-hash approved.
- [x] All 28 requirements allocated to exact approved criterion identities.
- [x] MCRM R0-R4 mechanically PASS.
- [ ] Operator explicitly unblocks M2 for R5 M01 microdesign.

## Readiness result

```text
R0 Baseline              PASS
R1 Applicability         PASS
R2 Requirements          PASS
R3 Capability Readiness  PASS
R4 Contract Readiness    PASS
R5 Milestone Microdesign NOT_STARTED
```

## Current blocker

The only remaining governance blocker is the separate Operator decision authorizing M2 to enter R5 microdesign. No Worker implementation or dispatch is authorized.

## Immediate next action

1. Present the final R0-R4 evidence packet and exact approved hash.
2. Require the exact M2-unblock token.
3. Record the decision without starting implementation automatically.
4. After unblock, write M01 microdesign before any Worker dispatch.
'''
          Path('docs/tracking/STATUS.md').write_text(status)

          worklog_path = Path('docs/tracking/WORKLOG.md')
          worklog = worklog_path.read_text()
          entry = f'''

### MIS-002 revision 5 approval and R4 allocation

- Operator supplied exact approval token for `{approved_hash}` after Lavish and adversarial review.
- Planning service materialized MIS-002 revision 5 as the approved schema-v2 contract; revision 3 remains immutable history.
- Converted all 28 proposed allocations to exact approved criterion identities and removed `BLOCK-MIS-002-REPLAN`.
- Added acceptance evidence `{acceptance_id}` and mechanically obtained R0-R4 PASS with R5 NOT_STARTED.
- M2 remains blocked pending a separate exact Operator decision; no Worker code, M01 microdesign or dispatch was authorized.
'''
          if '### MIS-002 revision 5 approval and R4 allocation' not in worklog:
              worklog += entry
          worklog_path.write_text(worklog)
          PY
      - run: npm run docs:generate
      - run: npm run verify
      - name: Commit finalized allocations
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finalize-mis-002-allocations.yml
          git add docs scripts/test-approved-mis-002-allocations.mjs package.json
          git commit -m "docs: allocate approved MIS-002 contract"
          git push origin HEAD:plan/mis-002-replan
